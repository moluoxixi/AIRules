name: CI

# PR、main 和 memory-superpowers 功能分支的质量门禁。发布仍仅由 main 触发。
on:
  push:
    branches: [main, codex/memory-superpowers]
  pull_request:
    branches: [main, codex/memory-superpowers]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, typecheck, test, and verify
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.32.1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint:check

      - name: Typecheck
        run: pnpm run typecheck

      - name: Build
        run: pnpm run build

      - name: Test
        run: pnpm test

      - name: Verify packed role installation
        run: pnpm run verify:packed-airules

      - name: Verify real upstream role installation
        timeout-minutes: 10
        run: pnpm run verify:remote-role-install

  platform-install:
    name: Platform install (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.32.1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build and smoke test the CLI
        run: |
          pnpm run build
          node bin/airules.js --version
          pnpm run verify:packed-airules

      - name: Test native install paths
        run: >-
          pnpm exec vitest run
          scripts/lib/__test__/hosts.test.ts
          scripts/lib/__test__/canonical-path.test.ts
          scripts/lib/__test__/roles.test.ts
          scripts/lib/__test__/role-inheritance.test.ts
          scripts/lib/__test__/role-install.e2e.test.mjs
          scripts/lib/__test__/install-coverage.test.ts
          scripts/lib/__test__/tool.test.ts
          scripts/lib/__test__/install-cli.test.ts
          scripts/lib/__test__/role-packages.test.ts
          scripts/lib/__test__/vendor-staging.test.ts
          roles/moluoxixi/__test__/init-project.test.ts
          roles/moluoxixi/__test__/moluoxixi-source.test.ts
          roles/trellis/__test__/trellis-mcp-projection.test.ts
          roles/general/__test__/general-role.test.ts
          roles/development/__test__/development-role.test.ts
          roles/matt/__test__/matt-role.test.ts
          roles/memory-superpowers/__test__/role.test.ts

  discover-role-packages:
    name: Discover role package workspaces
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.packages.outputs.matrix }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.32.1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install AIRules dependencies
        run: pnpm install --frozen-lockfile

      - name: Build role package matrix
        id: packages
        run: echo "matrix=$(pnpm exec tsx scripts/role-packages.ts matrix)" >> "$GITHUB_OUTPUT"

  verify-role-packages:
    name: Verify role packages (${{ matrix.role }})
    needs: discover-role-packages
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.discover-role-packages.outputs.matrix) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.32.1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install AIRules dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate role package configuration
        run: pnpm exec tsx scripts/role-packages.ts verify --role "${{ matrix.role }}"

      - name: Install role workspace dependencies
        working-directory: roles/${{ matrix.role }}
        run: pnpm install --include-workspace-root --no-frozen-lockfile

      - name: Test, typecheck, and verify publish tarballs
        working-directory: roles/${{ matrix.role }}
        run: pnpm run verify:publish && pnpm run typecheck

  memory-superpowers-integration:
    name: Memory superpowers integration (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    defaults:
      run:
        shell: bash
    env:
      UV_PYTHON: '3.12'
      PYTHONUTF8: '1'
      GIT_TERMINAL_PROMPT: '0'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'

      - name: Verify real pinned BMAD installation and input preservation
        run: uv run roles/memory-superpowers/__test__/bmad_integration.py

      - name: Initialize an isolated Basic Memory project
        run: |
          mkdir -p "$RUNNER_TEMP/airules-memory-integration"
          uv run roles/memory-superpowers/skills/memory-superpowers/scripts/project.py init --project "$RUNNER_TEMP/airules-memory-integration" --host codex

      - name: Verify real MCP handshake and repeat initialization
        run: uv run --with mcp roles/memory-superpowers/__test__/integration.py "$RUNNER_TEMP/airules-memory-integration"
