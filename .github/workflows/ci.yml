name: CI

# PR 与 main 推送阶段的质量门禁。发布门禁见 publish.yml（tag 触发）。
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, typecheck, test, and verify
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.32.1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint:check

      - name: Typecheck
        run: pnpm run typecheck

      - name: Build
        run: pnpm run build

      - name: Test
        run: pnpm test

  platform-install:
    name: Platform install (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.32.1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build and smoke test the CLI
        run: |
          pnpm run build
          node bin/airules.js --version

      - name: Test native install paths
        run: >-
          pnpm exec vitest run
          scripts/lib/__test__/canonical-path.test.ts
          scripts/lib/__test__/roles.test.ts
          scripts/lib/__test__/install-coverage.test.ts
          scripts/lib/__test__/tool.test.ts
          scripts/lib/__test__/install-cli.test.ts
          scripts/lib/__test__/vendor-staging.test.ts
          roles/trellis/__test__/trellis-mcp-projection.test.ts

  verify-moluoxixi-packages:
    name: Verify Moluoxixi package publication
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: roles/moluoxixi

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.32.1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install role workspace dependencies
        run: pnpm install --include-workspace-root --no-frozen-lockfile

      - name: Test, typecheck, and verify publish tarballs
        run: pnpm run verify:publish && pnpm run typecheck
