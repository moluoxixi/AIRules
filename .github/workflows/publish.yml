name: Publish package

on:
  push:
    branches: [main]
    paths:
      - package.json
      - README.md
      - README-en.md
      - 'bin/**'
      - 'capabilities/**'
      - 'constants/**'
      - 'docs/**'
      - 'roles/*/constants/**'
      - 'roles/*/role.yaml'
      - 'roles/*/runtime/**'
      - 'scripts/**'
      - '!scripts/**/__test__/**'
      - tsconfig.json
      - tsconfig.build.json

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-package-main
  cancel-in-progress: false

jobs:
  publish:
    name: Build, verify, and publish latest
    runs-on: ubuntu-latest

    steps:
      - name: Reject an unreliable diff base
        env:
          BEFORE_SHA: ${{ github.event.before }}
          CREATED: ${{ github.event.created }}
          FORCED: ${{ github.event.forced }}
        run: |
          if [ "$CREATED" = "true" ] || [ "$FORCED" = "true" ] || [ "$BEFORE_SHA" = "0000000000000000000000000000000000000000" ]; then
            echo "Cannot publish from a created or force-pushed main branch because its diff base is unreliable." >&2
            exit 1
          fi

      - name: Checkout main
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.32.1

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint:check

      - name: Typecheck
        run: pnpm run typecheck

      - name: Test
        run: pnpm test

      - name: Select the next patch version
        id: version
        run: |
          package_name="$(node -p "require('./package.json').name")"
          latest_version="$(npm view "$package_name@latest" version --registry https://registry.npmjs.org)"
          next_version="$(node -e '
            const match = process.argv[1].match(/^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$/u)
            if (!match) throw new Error(`npm latest is not stable semver: ${process.argv[1]}`)
            process.stdout.write(`${match[1]}.${match[2]}.${Number(match[3]) + 1}`)
          ' "$latest_version")"

          while npm view "$package_name@$next_version" version --registry https://registry.npmjs.org >/dev/null 2>&1; do
            next_version="$(node -e '
              const [major, minor, patch] = process.argv[1].split(".").map(Number)
              process.stdout.write(`${major}.${minor}.${patch + 1}`)
            ' "$next_version")"
          done

          npm version "$next_version" --no-git-tag-version --allow-same-version
          echo "version=$next_version" >> "$GITHUB_OUTPUT"

      - name: Publish latest
        run: npm publish --provenance --access public --tag latest
