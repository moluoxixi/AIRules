name: Publish role packages

on:
  push:
    branches: [main]
    paths:
      - 'roles/*/constants/skills.js'
      - 'roles/*/constants/skills.ts'
      - 'roles/*/package.json'
      - 'roles/*/packages/**'
      - 'roles/*/pnpm-lock.yaml'
      - 'roles/*/pnpm-workspace.yaml'

permissions:
  contents: read
  id-token: write

jobs:
  discover:
    name: Discover changed role package workspaces
    runs-on: ubuntu-latest
    outputs:
      has_changes: ${{ steps.packages.outputs.has_changes }}
      matrix: ${{ steps.packages.outputs.matrix }}

    steps:
      - name: Reject an unreliable diff base
        env:
          BEFORE_SHA: ${{ github.event.before }}
          CREATED: ${{ github.event.created }}
          FORCED: ${{ github.event.forced }}
        run: |
          if [ "$CREATED" = "true" ] || [ "$FORCED" = "true" ] || [ "$BEFORE_SHA" = "0000000000000000000000000000000000000000" ]; then
            echo "Cannot publish from a created or force-pushed main branch because its diff base is unreliable." >&2
            exit 1
          fi

      - name: Checkout main with diff history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.32.1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install AIRules dependencies
        run: pnpm install --frozen-lockfile --config.node-linker=hoisted

      - name: Build changed role package matrix
        id: packages
        env:
          AFTER_SHA: ${{ github.event.after }}
          BEFORE_SHA: ${{ github.event.before }}
        run: >-
          pnpm exec tsx scripts/role-packages.ts matrix
          --before "$BEFORE_SHA"
          --after "$AFTER_SHA"
          --github

  publish:
    name: Publish latest (${{ matrix.role }})
    needs: discover
    if: needs.discover.outputs.has_changes == 'true'
    runs-on: ubuntu-latest
    concurrency:
      group: publish-role-${{ matrix.role }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.discover.outputs.matrix) }}

    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.32.1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install AIRules dependencies
        run: pnpm install --frozen-lockfile --config.node-linker=hoisted

      - name: Select the next shared patch version
        id: release
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: pnpm exec tsx scripts/role-packages.ts prepare-latest --role "${{ matrix.role }}" --github

      - name: Install role workspace dependencies
        working-directory: roles/${{ matrix.role }}
        run: pnpm install --include-workspace-root --no-frozen-lockfile

      - name: Validate role package configuration
        run: pnpm exec tsx scripts/role-packages.ts verify --role "${{ matrix.role }}"

      - name: Run role publish gates and tarball verification
        working-directory: roles/${{ matrix.role }}
        run: pnpm run verify:publish && pnpm run typecheck

      - name: Publish packages in configured order
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: pnpm exec tsx scripts/role-packages.ts publish --role "${{ matrix.role }}"

      - name: Run role post-publish verification
        working-directory: roles/${{ matrix.role }}
        run: pnpm run --if-present verify:published
