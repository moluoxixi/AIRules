name: airules-hindsight

services:
  hindsight:
    image: ghcr.io/vectorize-io/hindsight:0.10.2
    restart: unless-stopped
    shm_size: 1gb
    ports:
      - '127.0.0.1:8888:8888'
      - '127.0.0.1:9999:9999'
    environment:
      HINDSIGHT_API_LLM_PROVIDER: ${HINDSIGHT_API_LLM_PROVIDER:?Set the LLM provider in hindsight.env}
      HINDSIGHT_API_LLM_MODEL: ${HINDSIGHT_API_LLM_MODEL:?Set the LLM model in hindsight.env}
      HINDSIGHT_API_LLM_API_KEY: ${HINDSIGHT_API_LLM_API_KEY:-}
      HINDSIGHT_API_LLM_BASE_URL: ${HINDSIGHT_API_LLM_BASE_URL:-}
      HINDSIGHT_API_WORKER_ID: airules-hindsight
      HINDSIGHT_CP_DATAPLANE_API_URL: http://localhost:8888
    volumes:
      - memory-data:/home/hindsight/.pg0

volumes:
  memory-data:
    name: airules-hindsight-data
