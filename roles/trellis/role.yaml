schema_version: 1
role_id: trellis
role_version: 0.5.0
status: stable
canonical_root: roles/trellis
description: Installs Trellis, shared coding and frontend capabilities, native project initialization, and Matt Pocock productivity skills through AIRules.
assets:
  skills: skills
  mcp: mcp
capabilities:
  - coding
  - productivity
  - frontend
hosts: all
extends_roles: [general]
role_vendor:
  name: trellis
  source: https://github.com/moluoxixi/AIRules.git
  setup:
    - command: npm
      args: [install, --global, '@mindfoldhq/trellis@latest']
  projections:
    - kind: role-assets
      source_dir: roles/trellis
distribution:
  bootstrap_manifest: role.yaml
  full_role_path_required: true
  npm_embedded_source: false
entrypoints:
  initialize_project_skill: init-project
  initialize_project_script: skills/init-project/scripts/run-role-cli.mjs
