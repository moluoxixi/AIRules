name: product-pm-bridge
version: 1
description: >
  OpenSpec-native product workflow bridged with PM skills and BMAD document
  workflows. OpenSpec owns product change lifecycle, schema validation and
  long-lived specs; pm-skills provide lightweight PRD, acceptance and edge-case
  methods; BMAD owns heavy PRD validation, long document sharding, epic/story
  split and project context capture; knowledge/ owns durable product context.

artifacts:
  - id: solution-brief
    generates: solution-brief.md
    description: Product solution framing and stakeholder alignment
    template: solution-brief.md
    instruction: |
      Use deliver-solution-brief or develop-solution-brief when available.
      Summarize problem, target users, proposed direction, trade-offs and
      open questions. Read knowledge/index.md before writing.
    requires: []

  - id: document-shards
    generates: document-shards.md
    description: Long product document sharding map
    template: document-shards.md
    instruction: |
      If the source PRD, solution brief, research note or architecture note is
      too long to inspect reliably in one context, use bmad-shard-doc to split
      it into section files and record the shard index here. If no sharding is
      needed, write an N/A rationale. Do not keep conflicting original and
      shard versions without documenting the chosen source of truth.
    requires:
      - solution-brief

  - id: prd
    generates: prd.md
    description: Product requirements document for the change
    template: prd.md
    instruction: |
      Prefer bmad-prd for company PRDs, existing long PRDs or high-risk product
      changes. Use bmad-prd create/update/validate as appropriate, and record
      any reviewer-gate findings. For lightweight changes, deliver-prd remains
      acceptable. Convert the approved solution brief into goals, non-goals,
      personas, scope, user journeys, requirements, success metrics,
      dependencies and risks. Phase-blocking unknowns MUST be marked
      MISSING blocked.
    requires:
      - solution-brief
      - document-shards

  - id: project-context
    generates: project-context.md
    description: Product and implementation context distilled for downstream agents
    template: project-context.md
    instruction: |
      Use bmad-generate-project-context when product context, implementation
      rules or domain constraints need a concise downstream handoff. This
      artifact is context, not enforcement: durable facts may be promoted to
      knowledge/index.md after review, but MUST NOT become a new rule source.
      If no project-context update is needed, write an N/A rationale.
    requires:
      - prd

  - id: adr
    generates: adr.md
    description: Product-impacting architecture or platform decision
    template: adr.md
    instruction: |
      Use develop-adr when the product decision implies a material technical,
      integration, data, platform or operational trade-off. If no ADR is
      needed, write a short N/A rationale. ADR facts feed epic/story splitting
      when they affect implementation sequence or acceptance boundaries.
    requires:
      - prd

  - id: epics-and-stories
    generates: epics-and-stories.md
    description: BMAD-style epics and implementation stories derived from PRD
    template: epics-and-stories.md
    instruction: |
      Use bmad-create-epics-and-stories when available. Break prd.md plus
      relevant ADR/project-context facts into epics and developer-ready stories
      with acceptance coverage. Preserve traceability to PRD requirement IDs.
      Do not invent missing API fields, route facts, permissions, state
      contracts or dependencies; mark required unknowns as MISSING blocked.
    requires:
      - prd
      - project-context
      - adr

  - id: acceptance-criteria
    generates: acceptance-criteria.md
    description: Given/When/Then acceptance criteria for the stories
    template: acceptance-criteria.md
    instruction: |
      Use deliver-acceptance-criteria when available. Write testable
      Given/When/Then criteria for each epic/story and mark unresolved facts
      as MISSING blocked. Criteria must be specific enough for development
      intake and frontend/backend test planning.
    requires:
      - epics-and-stories

  - id: edge-cases
    generates: edge-cases.md
    description: Boundary, failure and recovery scenarios
    template: edge-cases.md
    instruction: |
      Use deliver-edge-cases when available. Catalog limits, invalid inputs,
      race conditions, permissions, empty states, failure modes and recovery
      paths. Tie each item back to epics/stories or PRD requirements.
    requires:
      - acceptance-criteria

  - id: specs
    generates: 'specs/**/*.md'
    description: Durable product capability contract deltas
    template: spec.md
    instruction: |
      Create one specs/<capability>/spec.md per durable product capability
      changed by this PRD. Use ADDED, MODIFIED, REMOVED or RENAMED
      Requirements sections. Each requirement must use SHALL or MUST and
      contain at least one #### Scenario grounded in acceptance criteria.
    requires:
      - acceptance-criteria
      - edge-cases

apply:
  requires: [specs]
  tracks: acceptance-criteria.md
  instruction: |
    Product apply means the product package is ready for engineering intake.
    Validate OpenSpec, ensure all MISSING blocked items are resolved or
    explicitly carried as blockers, and hand off prd.md, project-context.md,
    epics-and-stories.md, acceptance-criteria.md, edge-cases.md, adr.md and
    specs/ to the development role.
