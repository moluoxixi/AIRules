name: frontend-superpowers-bridge
version: 1
source:
  repository: https://github.com/lihan3238/speckit-superpowers-bridge
  basis:
    - .specify/templates/spec-template.md
    - .specify/templates/plan-template.md
    - .specify/templates/tasks-template.md
    - .specify/extensions/speckit-superpowers-bridge/commands/speckit.speckit-superpowers-bridge.execute.md
    - .specify/extensions/speckit-superpowers-bridge/commands/speckit.speckit-superpowers-bridge.handoff.md
install:
  target: .specify/airules-schemas/frontend-superpowers-bridge
  manifest: .specify/airules-schema.yaml
  manifest_schema_line: 'schema: frontend-superpowers-bridge'
description: >
  Frontend-focused Spec Kit workflow schema derived from the cloned
  speckit-superpowers-bridge Spec Kit templates and bridge command
  protocol. Use this schema only when the project or current change
  materially affects UI pages, components, frontend state, routes,
  permissions, browser interactions, or responsive behavior.
  AIRules projected skills must be available through role sync; no
  Claude plugin installation instructions are used.

required_project_assets:
  - .specify/templates/spec-template.md
  - .specify/templates/plan-template.md
  - .specify/templates/tasks-template.md
  - .specify/extensions/speckit-superpowers-bridge/
  - .specify/superpowers-handoff.json

required_projected_skills:
  - superpowers:test-driven-development
  - superpowers:systematic-debugging
  - superpowers:verification-before-completion
  - superpowers:requesting-code-review
  - superpowers:finishing-a-development-branch

ecc_execution_agents:
  - planner
  - tdd-guide
  - pr-test-analyzer
  - e2e-runner
  - code-reviewer
  - typescript-reviewer
  - react-reviewer
  - vue-reviewer
  - react-build-resolver
  - build-error-resolver
  - silent-failure-hunter

templates:
  spec: templates/spec-template.md
  plan: templates/plan-template.md
  tasks: templates/tasks-template.md

bridge_commands:
  execute: commands/speckit.speckit-superpowers-bridge.execute.md
  handoff: commands/speckit.speckit-superpowers-bridge.handoff.md

frontend_gates:
  field_contract:
    required: true
    source_types:
      - API
      - OpenAPI
      - interface code
      - API client
      - store
      - route params
      - permission
      - state
      - persistence
      - static
      - derived
    missing_value: 'MISSING blocked: <reason>'
    rule: >
      UI-required fields absent or ambiguous in source contracts block
      plan and tasks generation until the source is fixed or scope is
      changed. Do not use mock fields, guessed defaults, empty fallback
      values, or "fill later" placeholders.
  component_reuse:
    required: true
    decisions:
      - existing
      - wrap existing
      - new
    rule: >
      Search existing components, hooks, composables, utilities, and
      installed UI libraries before creating or wrapping components.
  states:
    required: true
    coverage:
      - loading
      - empty
      - error
      - disabled
      - success
      - permission-denied
      - pending
      - not-applicable
  frontend_testing:
    required: true
    discipline: frontend-testing
    evidence:
      - command
      - exit status
      - desktop viewport
      - mobile viewport
      - console check
      - network check
      - screenshot or log path

execution_flow:
  - Run Spec Kit native specification flow to produce spec.md, plan.md, and tasks.md.
  - Apply the frontend additions in this schema to the generated Spec Kit files.
  - Use speckit-superpowers-bridge to execute tasks.md with AIRules projected skills.
  - Set the bridge handoff to blocked when a frontend contract gap makes implementation unsafe.
