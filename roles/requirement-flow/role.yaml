schema_version: 2
role_id: requirement-flow
role_version: 0.4.3
status: experimental
canonical_root: roles/requirement-flow
description: Project-local requirements graphs, dependency-based task dispatch and evidence tracking for Codex.
extends_roles: []
provides:
  capabilities: []
installation:
  hosts: [codex]
  assets:
    skills: skills
  role_vendor:
    name: requirement-flow-role
    source: https://github.com/moluoxixi/AIRules.git
    projections:
      - kind: role-assets
        source_dir: roles/requirement-flow
  distribution:
    bootstrap_manifest: role.yaml
    full_role_path_required: true
    npm_embedded_source: false
  entrypoints:
    initialize_project_skill: requirement-flow
    initialize_project_script: skills/requirement-flow/install_project.py
