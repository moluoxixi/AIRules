<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="model-sha256" content="@@DIGEST@@">
  <title>@@TITLE@@ · 需求全景图</title>
  <style>
    :root { color-scheme:light; --ink:#203c46; --muted:#52656a; --line:#d9dfd8; --paper:#f8f8f4; --teal:#20565c; --blue:#246482; --amber:#85581f;
      --ui:"Instrument Sans","PingFang SC","Microsoft YaHei",system-ui,sans-serif; --mono:"IBM Plex Mono","SFMono-Regular",Consolas,monospace; font:15px/1.5 var(--ui); }
    * {box-sizing:border-box} body {margin:0;color:var(--ink);background:var(--paper)}
    button,a {font:inherit; color:inherit} button {cursor:pointer} a {color:var(--blue);text-underline-offset:.18em}
    button:focus-visible,a:focus-visible,[tabindex]:focus-visible {outline:3px solid var(--blue);outline-offset:3px}
    [hidden] {display:none!important}
    .app {height:100vh;height:100dvh;min-height:220px;display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr) auto;overflow:hidden}
    header {display:flex;gap:12px;align-items:center;justify-content:space-between;min-height:64px;padding:10px clamp(12px,2.4vw,32px);background:white;border-bottom:1px solid var(--line)}
    .identity,.controls,.legend,.tools,.button-link {display:flex;align-items:center}
    .identity {gap:11px;min-width:0}.identity>div {min-width:0}
    .mark {position:relative;display:grid;place-items:center;flex:none;width:38px;height:38px;background:#193c4a;border-radius:11px;color:white}
    .mark svg {width:27px;height:27px}
    h1,h2,h3,h4,p,ol,ul,dl {margin:0}
    h1 {font-size:clamp(1.03rem,2vw,1.33rem);font-weight:730;line-height:1.25;letter-spacing:-.035em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .edition {color:var(--muted);font:.74rem var(--mono);letter-spacing:.02em;margin-top:4px;display:block}
    .tools {gap:4px}
    header button,header a,.controls button,.close,.link-button,.refresh {border:0;background:transparent;border-radius:7px;text-decoration:none;padding:.4rem .58rem}
    header button,header a {color:#36556d} header button:hover,header a:hover,.controls button:hover,.close:hover,.link-button:hover {background:#edf3f7;color:var(--ink)}
    .button-link {gap:6px;white-space:nowrap;font-weight:550;font-size:.85rem}
    .button-link svg,.controls svg,.close svg,.drawer-tab svg {width:17px;height:17px;display:block;fill:none;stroke:currentColor;stroke-width:1.65;stroke-linecap:round;stroke-linejoin:round}
    .feature-bar {position:relative;min-width:0;max-width:260px;flex:0 1 auto}
    .filter-toggle {display:flex;align-items:center;gap:7px;min-height:32px;max-width:100%;padding:4px 10px;border:1px solid #c7d3cd;border-radius:18px;background:#fff;color:#37555a;font:600 .82rem/1.4 var(--ui)}
    .filter-toggle:hover,.filter-toggle[aria-expanded=true] {border-color:#769a98;background:#f1f6f1}
    .filter-toggle[data-filtered=true] {color:#165656;border-color:#8fb7a9;background:#e7f2e9}
    .filter-toggle svg,.feature-search svg {display:block;flex:none;width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.65;stroke-linecap:round;stroke-linejoin:round}
    .filter-short {display:none}
    #filter-summary {min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    #filter-badge {flex:none;min-width:17px;padding:0 3px;border-radius:5px;background:#20565c;color:#fff;font:600 .69rem/17px var(--mono);text-align:center}
    .filter-toggle .filter-caret {width:10px;height:10px}
    .filter-toggle[aria-expanded=true] .filter-caret {transform:rotate(180deg)}
    .filter-popover {position:absolute;top:calc(100% + 9px);left:0;z-index:6;display:flex;flex-direction:column;gap:9px;width:344px;max-height:min(400px,calc(100vh - 120px));max-height:min(400px,calc(100dvh - 120px));overflow:auto;padding:12px;background:#fffefb;border:1px solid #b7c9c0;border-radius:14px;box-shadow:0 12px 30px #1c373126,0 2px 5px #1c373112}
    .feature-search {display:flex;align-items:center;flex:none;gap:8px;padding:6px 10px;min-height:34px;background:white;border:1px solid #acbeb6;border-radius:7px;color:#4d6a64}
    .feature-search:focus-within {outline:2px solid var(--blue);outline-offset:1px}
    .feature-search input {font:inherit;font-size:.9rem;min-width:0;width:100%;border:0;background:transparent;color:var(--ink);outline:none}
    .filter-scroll {min-height:28px;overflow-y:auto;overscroll-behavior:contain;scrollbar-width:thin;scrollbar-color:#a8bbb2 transparent;padding:3px}
    .feature-list {display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:3px 4px}
    .feature-chip {display:flex;align-items:center;gap:7px;text-align:left;min-height:33px;padding:5px 6px;border:1px solid transparent;border-radius:6px;background:transparent;color:#314a4d;font:520 .85rem/1.4 var(--ui);overflow-wrap:anywhere}
    .feature-chip::before {content:"";width:13px;height:13px;box-sizing:border-box;flex:none;border:1px solid #9dafa7;border-radius:4px;background:white}
    .feature-chip:hover {background:#f1f4ed}
    .feature-chip[aria-pressed=true] {background:#e7f2e9;color:#194d4b}
    .feature-chip[aria-pressed=true]::before {content:"✓";background:#28605b;border-color:#28605b;color:white;text-align:center;font:700 10px/11px system-ui}
    #all-features {grid-column:1/-1}
    .filter-footer {display:flex;align-items:center;gap:9px;flex:none;border-top:1px solid var(--line);padding:8px 2px 0}
    .feature-count {margin-right:auto;color:var(--muted);font:.78rem var(--ui);font-variant-numeric:tabular-nums}
    .filter-footer button,.reset-search {min-height:30px;border:0;border-radius:6px;padding:4px 10px;font:600 .8rem var(--ui)}
    #filter-reset {color:var(--teal);background:transparent}
    #filter-reset:hover {background:#eef4ee}
    #filter-done,.reset-search {color:#fff;background:var(--teal)}
    #filter-done:hover,.reset-search:hover {background:#173f43}
    #filter-no-match {padding:12px 5px;color:var(--muted);font-size:.84rem}
    .no-results footer>* {visibility:hidden}
    .button-link[aria-disabled=true] {color:#728391;cursor:default}
    .empty-search {position:absolute;inset:0;display:grid;align-content:center;justify-items:center;gap:10px;padding:20px;text-align:center;overflow-wrap:anywhere}
    .surface {position:relative;min-height:0;overflow:hidden;background-color:var(--paper);background-image:radial-gradient(#c4cdc1 .7px,transparent .85px);background-size:20px 20px}
    .surface>noscript {position:absolute;inset:16px auto auto 16px}
    #map {display:block;width:100%;height:100%;touch-action:none;user-select:none;cursor:grab} #map.dragging {cursor:grabbing}
    footer {min-height:49px;padding:6px clamp(10px,2.2vw,30px);background:white;border-top:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:8px}
    .legend {gap:13px;flex-wrap:wrap;color:#485e73;font-size:.78rem}
    .legend span {display:inline-flex;align-items:center;gap:5px}
    .rail {width:20px;display:inline-block;border-top:2px solid #65808a}
    .rail.branch {border-top:2px dashed #a16c2d}
    .controls {gap:3px;flex:none;color:#35526b}.controls button {padding:6px 7px;font-size:.84rem}
    .controls output {min-width:40px;text-align:center;font: .8rem var(--mono);font-variant-numeric:tabular-nums}
    .controls .fit {display:flex;gap:6px;align-items:center;margin-left:4px;border-left:1px solid var(--line);border-radius:0 6px 6px 0;padding-left:11px}
    .controls [aria-disabled=true] {color:#8594a0;cursor:default}
    #drawer-layer {position:fixed;inset:0;z-index:20;isolation:isolate;overflow:hidden}
    #drawer-backdrop {position:absolute;inset:0;background:rgba(22,36,40,.47);opacity:0}
    #inspector {position:absolute;inset:0 0 0 auto;width:min(88%,clamp(360px,38vw,480px));background:#fff;box-shadow:-5px 0 26px #182a332d;overflow:hidden;display:flex;flex-direction:column;container-type:inline-size;transform:translateX(100%)}
    #drawer-layer.is-open #drawer-backdrop {opacity:1}
    #drawer-layer.is-open #inspector {transform:translateX(0)}
    @media(prefers-reduced-motion:no-preference) {
      #drawer-backdrop {transition:opacity .22s ease}
      #inspector {transition:transform .22s cubic-bezier(.24,.71,.28,1)}
    }
    .panelbar {display:flex;align-items:center;gap:9px;flex:none;min-height:62px;padding:12px 14px 12px 20px;background:#fff;border-bottom:1px solid var(--line)}
    #panel-type {flex:none;font-size:.74rem;font-weight:650;color:#425e58;background:#edf2ee;border-radius:5px;padding:2px 6px}
    #panel-title {font-size:1.12rem;line-height:1.35;overflow-wrap:anywhere}
    .close,.drawer-tab {display:inline-flex;align-items:center;justify-content:center;gap:4px;color:var(--teal);font:600 .8rem/1.4 var(--ui)}
    .close {flex:none;width:36px;height:36px;margin-left:auto;padding:6px;color:var(--muted)}
    .drawer-tab {position:absolute;top:12px;right:0;z-index:2;min-height:36px;padding:5px 10px;border:1px solid #b4c6bd;border-right:0;border-radius:8px 0 0 8px;background:#fff;box-shadow:0 2px 6px #213c4512}
    .drawer-tab:hover,.close:hover {background:#e5eee8}
    #detail {flex:1;min-height:0;overflow:auto;overscroll-behavior:contain;padding:16px 20px max(20px,env(safe-area-inset-bottom));line-height:1.52;overflow-wrap:anywhere;user-select:text}
    #detail h3 {font-size:.92rem;margin:17px 0 6px;color:#35526b}
    #detail h4 {font-size:.9rem;margin:8px 0 4px} #detail p+ p {margin-top:6px} #detail p,#detail li,#detail dd {font-size:.9rem}
    #detail ul,#detail ol {padding-left:1.3rem} #detail li+li {margin-top:3px}
    #detail code {font: .86rem var(--mono);background:#edf4f6;border-radius:4px;padding:.1rem .27rem;color:#265365}
    #detail dl {display:grid;grid-template-columns:minmax(50px,auto) minmax(0,1fr);gap:5px 10px;margin-top:9px}
    #detail dt {font-size:.8rem;color:var(--muted)} #detail dd {margin:0}
    .record,.field,.choice {border-top:1px solid var(--line);padding:8px 0 5px}
    .queue-item {display:flex;align-items:baseline;flex-wrap:wrap;gap:3px 8px;font-size:.82rem}
    .field strong {display:block;margin:0 0 4px} .dim {color:var(--muted)}
    .choice strong {color:var(--amber)} .choice details,.compact-fold {font-size:.86rem;color:var(--muted);margin-top:6px}
    summary {cursor:pointer;color:var(--blue);width:fit-content}
    .link-button {color:var(--blue);padding:.25rem .5rem;background:#f0f5fa;margin:3px 4px 0 0;font-size:.84rem}
    form {margin-top:15px} form label {display:grid;gap:4px;font-size:.83rem;color:var(--muted)}
    form input {font:inherit;border:1px solid #acc0d0;border-radius:6px;padding:7px}
    .choose,.refresh {background:#173e60;color:white;border:0;border-radius:6px;padding:6px 9px;font:inherit;font-size:.83rem;margin:6px 6px 0 0}
    .notice {position:absolute;top:8px;left:50%;transform:translateX(-50%);background:#fff8e9;border:1px solid #d2a157;padding:5px 10px;border-radius:7px;z-index:4;font-size:.84rem}
    .notice button {margin:0 0 0 6px} .sr {position:absolute;width:1px;height:1px;clip-path:inset(50%);overflow:hidden}
    @media(max-width:790px) {
      header {min-height:59px}.tools {gap:0}
    }
    @media(max-width:510px) {
      header {min-height:54px;padding:7px 10px;gap:4px}.identity {gap:7px}.mark{width:33px;height:33px}.edition{font-size:.68rem}
      .button-link {gap:3px;padding:6px;font-size:.78rem} footer {min-height:45px;gap:4px}
      .legend {gap:6px;font-size:.7rem}.rail {width:13px}.controls {gap:0}.controls button{padding:5px}.controls output{min-width:31px;font-size:.73rem}
    }
    @media(max-width:365px) {.tools .extra {position:absolute;clip-path:inset(50%);width:1px;height:1px;overflow:hidden}}
    .map-bar {position:relative;z-index:5;display:flex;align-items:center;gap:10px;padding:5px clamp(10px,2.4vw,32px);background:#fffffc;border-bottom:1px solid var(--line)}
    .map-modes {display:inline-flex;gap:2px;background:#eef1ec;border-radius:8px;padding:3px;flex:none}
    .map-modes button {background:none;border:1px solid transparent;border-radius:6px;color:#42595c;white-space:nowrap;padding:4px 10px;font:600 .84rem/1.5 var(--ui)}
    .map-modes button:hover {background:#dfe9e3}
    .map-modes button[aria-pressed=true] {color:#fff;background:#244b53;border-color:#244b53}
    .controls {margin-left:auto;gap:2px}
    .controls button {display:grid;place-items:center;min-width:32px;min-height:32px;padding:5px}
    .controls .fit {display:flex;margin-left:3px;padding-inline:9px 3px;border-left:1px solid var(--line)}
    .controls #scale {min-width:47px;padding-inline:3px;font:600 .78rem var(--mono)}
    .controls .lock[aria-pressed=true] {color:#20565c;background:#e4eeea;box-shadow:inset 0 0 0 1px #99b4a8}
    .lock[aria-pressed=true] .unlocked,.lock[aria-pressed=false] .locked {display:none}
    .controls [aria-disabled=true]:hover {color:#8594a0;background:transparent}
    footer {min-height:31px;padding-block:4px}.canvas-hint {color:#50677b;font-size:.74rem}
    .field dd,#detail code {white-space:pre-line}
    .story-goal {color:var(--muted)}
    #detail .acceptance-report>h3 {font-size:.92rem;color:var(--ink);margin:10px 0 6px}
    .acceptance-group {--state-color:#805117;border-inline-start:3px solid #dab77d;padding:6px 10px;margin:5px 0 8px;background:#fcf8f0;border-radius:2px 8px 8px 2px}
    .acceptance-group[data-state="passed"] {--state-color:#265e4c;border-color:#8fb6a1;background:#f2f7f3}
    #detail .acceptance-group h4 {font-size:.8rem;color:var(--state-color);margin:0 0 3px;line-height:1.5}
    .case-row {display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:baseline;gap:0 10px;padding-block:3px}
    .case-row+.case-row {border-top:1px solid #173d3817;margin-top:3px;padding-top:5px}
    #detail .case-title {font-size:.94rem;line-height:1.45;font-weight:650;color:#203c46}
    #detail .case-outcome {grid-column:1;font-size:.85rem;line-height:1.43;margin:1px 0;color:#405454}
    #detail .case-scope {text-align:end;font-size:.76rem;font-weight:550;color:var(--state-color);max-width:12em}
    .case-row .case-proof {font-size:.77rem;margin:0;justify-self:end}
    .case-proof summary {color:#475f65}
    .case-row .case-proof[open] {grid-column:1 / -1;justify-self:stretch;margin-top:4px}
    .case-proof[open]>summary {margin-left:auto}
    @container (max-width:365px) {
      .case-row {grid-template-columns:minmax(0,1fr) auto}
      #detail .case-title,#detail .case-outcome {grid-column:1 / -1}
      #detail .case-scope {grid-column:1;grid-row:3;text-align:start}
      .case-row .case-proof {grid-column:2;grid-row:3}
      .case-row .case-proof[open] {grid-row:4}
    }
    .story-tools {display:flex;align-items:baseline;flex-wrap:wrap;gap:3px 12px;border-top:1px solid var(--line);margin-top:12px;padding-top:8px}
    .story-tools>.compact-fold {margin:0}
    .story-tools>.compact-fold[open] {flex-basis:100%;padding-bottom:6px}
    .story-tools summary,.inspect-feature {font:550 .82rem/1.55 var(--ui);color:#2a6267;padding:3px 0}
    .inspect-feature {background:none;border:0}
    .inspect-feature::after {content:" →"}
    .inspect-feature:hover,.story-tools summary:hover {text-decoration:underline}
    details>summary:focus-visible {outline:2px solid var(--blue);outline-offset:2px;border-radius:3px}
    .source-note {white-space:pre-line;font: .78rem/1.65 var(--mono);overflow-wrap:anywhere}
    .no-results .controls,.no-results footer {visibility:hidden}
    @media(max-width:700px) {.controls .fit span {display:none}.controls .fit {padding:5px 7px}.tools .button-link {font-size:.77rem}}
    @media(max-width:420px) {.map-modes button {padding-inline:7px}.map-bar {padding-inline:7px;gap:4px}.controls {gap:0}.controls button{min-width:30px}.controls .fit {margin-left:1px}.tools .button-link {font-size:0;gap:0}.tools .button-link svg {width:18px;height:18px}.identity {flex:1}}
    @media(max-width:640px) {
      .feature-bar {position:static}
      .filter-popover {top:calc(100% + 4px);left:clamp(8px,calc(100% - 354px),150px);width:min(344px,calc(100% - 16px))}
    }
    @media(max-width:510px) {
      .map-bar {gap:6px;padding-inline:8px}
      .filter-toggle {gap:5px;padding-inline:8px}
      .map-modes button {padding-inline:7px}
    }
    @media(max-width:400px) {
      .mode-prefix {display:none}
      .map-modes button {padding-inline:6px}
      .filter-toggle {gap:4px;padding-inline:6px}
      .controls #scale {min-width:37px}
      .controls button {min-width:28px}
    }
    @media(max-height:420px) {.filter-popover {gap:5px;padding:8px;max-height:calc(100dvh - 108px)}}
    @media(max-width:360px) {
      .filter-toggle {padding-inline:5px}
      .filter-toggle .filter-caret,.filter-toggle>svg:first-child {display:none}
      .filter-toggle[data-filtered=false] #filter-summary {display:none}
      .filter-toggle[data-filtered=false] .filter-short {display:inline}
    }
    @media(max-width:330px) {.controls {gap:0}.legend {font-size:.67rem}.canvas-hint {font-size:.66rem}}
    @media(prefers-reduced-motion:reduce) {*{scroll-behavior:auto!important}}
  </style>
</head>
<body>
<div class="app">
<div class="app-head">
<header>
  <div class="identity"><span class="mark" aria-hidden="true"><svg viewBox="0 0 28 28" fill="none"><path d="M5 14h7m0 0c3 0 1-7 6-7h5m-11 7c3 0 1 7 6 7h5" stroke="#b4e8da" stroke-width="2.1"/><circle cx="5" cy="14" r="3.1" fill="#fff"/><circle cx="23" cy="7" r="2.7" fill="#8cd5c7"/><circle cx="23" cy="21" r="2.7" fill="#f8c875"/></svg></span><div><h1 title="@@TITLE@@">@@TITLE@@</h1><span class="edition">需求全景图 · @@KIND@@ · v@@VERSION@@</span></div></div>
  <div class="tools"><button type="button" class="button-link" id="export" title="保存完整、可放大的 SVG 图"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12m-4-4 4 4 4-4M4 15v4a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-4"/></svg><span id="export-caption">导出整图</span></button><a id="ai-record" href="model.json" class="button-link" title="读取同一版需求的 JSON"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m8 7-5 5 5 5m8-10 5 5-5 5m-3-13-2 16"/></svg>AI 记录</a></div>
</header>
  <div class="map-bar">
    <div id="map-modes" role="group" aria-label="视图" class="map-modes">
      <button type="button" id="overview-mode" aria-pressed="true" aria-label="功能总览"><span class="mode-prefix">功能</span>总览</button>
      <button type="button" id="detail-mode" aria-pressed="false" aria-label="实现链路"><span class="mode-prefix">实现</span>链路</button>
    </div>
    <div class="feature-bar" id="feature-bar" hidden>
      <button class="filter-toggle" id="filter-toggle" type="button" aria-label="筛选功能" aria-expanded="false" aria-controls="filter-popover" aria-haspopup="dialog">
        <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M2.5 6h6m4 0h5m-15 8h2m4 0h9"/><circle cx="10.5" cy="6" r="2"/><circle cx="6.5" cy="14" r="2"/></svg>
        <span id="filter-summary">筛选功能</span><span class="filter-short" aria-hidden="true">筛选</span><span id="filter-badge" hidden></span>
        <svg class="filter-caret" viewBox="0 0 12 12" aria-hidden="true"><path d="m2.5 4.5 3.5 3.5 3.5-3.5"/></svg>
      </button>
      <section class="filter-popover" id="filter-popover" role="dialog" aria-label="筛选功能" hidden>
        <label class="feature-search"><svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="8" cy="8" r="5"/><path d="m12 12 4.5 4.5"/></svg><input type="search" id="feature-query" aria-label="搜索功能点" placeholder="搜索功能点" autocomplete="off" maxlength="80"></label>
        <div class="filter-scroll">
          <div id="feature-list" class="feature-list" role="group" aria-label="选择功能点，可多选"><button type="button" id="all-features" class="feature-chip" aria-pressed="true">全部功能</button></div>
          <p id="filter-no-match" hidden>没有匹配的功能</p>
        </div>
        <div class="filter-footer">
          <output id="feature-count" class="feature-count" aria-live="polite"></output>
          <button type="button" id="filter-reset" hidden>清除筛选</button>
          <button type="button" id="filter-done">完成</button>
        </div>
      </section>
    </div>
    <div class="controls" id="map-tools" role="group" aria-label="画布工具">
      <button id="minus" type="button" aria-label="缩小" title="缩小"><svg viewBox="0 0 24 24"><path d="M5 12h14"/></svg></button>
      <button id="scale" type="button" aria-label="恢复 100% 阅读视图" title="恢复 100% 并回到阅读起点">100%</button>
      <button id="plus" type="button" aria-label="放大" title="放大"><svg viewBox="0 0 24 24"><path d="M5 12h14m-7-7v14"/></svg></button>
      <button class="lock" id="zoom-lock" type="button" aria-pressed="true" aria-label="锁定手势缩放" title="手势缩放已锁定，点击解锁"><svg viewBox="0 0 24 24"><rect x="5" y="10.5" width="14" height="10" rx="2.3"/><path class="locked" d="M8 10.5V7a4 4 0 0 1 8 0v3.5"/><path class="unlocked" d="M8 10.5V7a4 4 0 0 1 7.6-1.7"/><path d="M12 14.5v2.2"/></svg></button>
      <button class="fit" id="fit" type="button" aria-label="适应画布" title="把当前视图的全部节点放入画布"><svg viewBox="0 0 24 24"><path d="M9 4H4v5m11-5h5v5M4 15v5h5m11-5v5h-5"/></svg><span>适应画布</span></button>
    </div>
  </div>
</div>
<main class="surface" aria-label="需求关系画布">
  <p id="map-help" class="sr">箭头连接故事、接口、处理和验收。点击卡片或按回车查看详情。拖动画布可平移。手势缩放默认锁定，可用右上角按钮调整比例。</p>
  <svg id="map" xmlns="http://www.w3.org/2000/svg" tabindex="0" role="group" aria-label="需求关系图" aria-describedby="map-help">
    <defs id="drawing-defs"><style id="graph-style">
      .map-node {cursor:pointer;outline:none}.map-node text,.map-label {font-family:"Instrument Sans","PingFang SC","Microsoft YaHei",system-ui,sans-serif;pointer-events:none}
      .map-node .n-title{font-weight:680;letter-spacing:-.3px}.map-node .n-label{font-weight:600;letter-spacing:.15px}
      .map-node .mono{font-family:"IBM Plex Mono","SFMono-Regular",Consolas,monospace;letter-spacing:-.3px}
      .map-line {fill:none;stroke-linecap:round;stroke-linejoin:round}
      .map-node:hover .outline,.map-node:focus-visible .outline,.map-node.selected .outline {stroke:#205773;stroke-width:3}
      .map-node.muted,.map-edge.muted {opacity:.27}.map-node.selected .n-title {font-weight:760}
    </style></defs>
    <g id="world"><g id="wires"></g><g id="wire-labels"></g><g id="stations"></g></g>
  </svg>
  <div class="empty-search" id="empty-search" hidden><strong id="empty-label"></strong><button type="button" class="reset-search" id="clear-search">清空搜索</button></div>
  <noscript>打开交互图需要启用 JavaScript。可以从页头读取同一版 AI 记录。</noscript>
  <button id="reopen-panel" class="drawer-tab" type="button" aria-label="展开详情" title="展开所选节点的详情" aria-controls="inspector" aria-expanded="false" hidden>
    <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M15 4v16m-4-11-3 3 3 3"/></svg>详情
  </button>
  <div id="notice" hidden class="notice" role="status">记录已更新。<button class="refresh" id="refresh" type="button">读取最新版</button></div>
</main>
<footer>
  <div class="legend" aria-label="连线图例"><span><i class="rail"></i><span id="relation-label">包含功能</span></span><span id="branch-legend" hidden><i class="rail branch"></i>条件分支</span></div>
  <span class="canvas-hint">拖动平移 · 点击卡片查看详情</span>
</footer>
</div>
<div id="drawer-layer" hidden>
  <div id="drawer-backdrop" aria-hidden="true"></div>
  <aside id="inspector" role="dialog" aria-modal="true" aria-labelledby="panel-title" tabindex="-1" hidden>
    <div class="panelbar"><span id="panel-type"></span><h2 id="panel-title"></h2><button class="close" id="close-panel" type="button" aria-label="关闭详情" title="关闭详情（Esc）"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M6 18 18 6"/></svg></button></div>
    <div id="detail"></div>
  </aside>
</div>
