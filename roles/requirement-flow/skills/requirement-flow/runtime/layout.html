<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="model-sha256" content="@@DIGEST@@">
  <title>@@TITLE@@ · 需求全景图</title>
  <style>
    @@THEME@@
    :root { font:15px/1.5 var(--ui) }
    * {box-sizing:border-box} body {margin:0;color:var(--ink);background:var(--paper)}
    button,a {font:inherit; color:inherit} button {cursor:pointer} a {color:var(--blue);text-underline-offset:.18em}
    button:focus-visible,a:focus-visible,[tabindex]:focus-visible {outline:3px solid var(--blue);outline-offset:3px}
    [hidden] {display:none!important}
    .app {height:100vh;height:100dvh;min-height:220px;display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr) auto;overflow:hidden}
    header {display:flex;gap:12px;align-items:center;justify-content:space-between;min-height:64px;padding:10px clamp(12px,2.4vw,32px);background:var(--surface);border-bottom:1px solid var(--line)}
    .identity,.controls,.legend,.tools,.button-link {display:flex;align-items:center}
    .identity {gap:11px;min-width:0}.identity>div {min-width:0}
    .mark {position:relative;display:grid;place-items:center;flex:none;width:38px;height:38px;background:var(--surface);border-radius:11px;color:var(--ink)}
    .mark svg {width:27px;height:27px}
    h1,h2,h3,h4,p,ol,ul,dl {margin:0}
    h1 {font-size:clamp(1.03rem,2vw,1.33rem);font-weight:730;line-height:1.25;letter-spacing:-.035em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .edition {color:var(--muted);font:.74rem var(--mono);letter-spacing:.02em;margin-top:4px;display:block}
    .graph-crumb {display:flex;align-items:center;gap:7px;color:var(--muted);font-size:.72rem;line-height:1.2;margin-bottom:4px}
    .graph-crumb .edition {margin:0;font-size:.69rem}
    header #catalog-home {display:inline-flex;align-items:center;gap:2px;padding:1px 2px 1px 0;color:var(--teal);font-weight:650}
    #catalog-home::after {content:"";display:inline-block;height:11px;border-right:1px solid var(--line);margin-left:4px}
    #catalog-home svg {width:13px;height:13px;fill:none;stroke:currentColor;stroke-width:1.7}
    .tools {gap:4px}
    header button,header a,.controls button,.close,.link-button,.refresh {border:0;background:transparent;border-radius:7px;text-decoration:none;padding:.4rem .58rem}
    header button,header a {color:var(--text)} header button:hover,header a:hover,.controls button:hover,.close:hover,.link-button:hover {background:var(--surface-hover);color:var(--ink)}
    .button-link {gap:6px;white-space:nowrap;font-weight:550;font-size:.85rem}
    .button-link svg,.controls svg,.close svg,.drawer-tab svg {width:17px;height:17px;display:block;fill:none;stroke:currentColor;stroke-width:1.65;stroke-linecap:round;stroke-linejoin:round}
    .feature-bar {position:relative;min-width:0;max-width:260px;flex:0 1 auto}
    .filter-toggle {display:flex;align-items:center;gap:7px;min-height:32px;max-width:100%;padding:4px 10px;border:1px solid var(--line);border-radius:18px;background:var(--surface);color:var(--text);font:600 .82rem/1.4 var(--ui)}
    .filter-toggle:hover,.filter-toggle[aria-expanded=true] {border-color:var(--line-strong);background:var(--surface-hover)}
    .filter-toggle[data-filtered=true] {color:var(--teal);border-color:var(--line-strong);background:var(--success-bg)}
    .filter-toggle svg,.feature-search svg {display:block;flex:none;width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.65;stroke-linecap:round;stroke-linejoin:round}
    .filter-short {display:none}
    #filter-summary {min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    #filter-badge {flex:none;min-width:17px;padding:0 3px;border-radius:5px;background:var(--teal);color:var(--on-accent);font:600 .69rem/17px var(--mono);text-align:center}
    .filter-toggle .filter-caret {width:10px;height:10px}
    .filter-toggle[aria-expanded=true] .filter-caret {transform:rotate(180deg)}
    .filter-popover {position:absolute;top:calc(100% + 9px);left:0;z-index:6;display:flex;flex-direction:column;gap:9px;width:344px;max-height:min(400px,calc(100vh - 120px));max-height:min(400px,calc(100dvh - 120px));overflow:auto;padding:12px;background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:0 12px 30px #0005,0 2px 5px #0005}
    .feature-search {display:flex;align-items:center;flex:none;gap:8px;padding:6px 10px;min-height:34px;background:var(--surface);border:1px solid var(--line);border-radius:7px;color:var(--muted)}
    .feature-search:focus-within {outline:2px solid var(--blue);outline-offset:1px}
    .feature-search input {font:inherit;font-size:.9rem;min-width:0;width:100%;border:0;background:transparent;color:var(--ink);outline:none}
    .filter-scroll {min-height:28px;overflow-y:auto;overscroll-behavior:contain;scrollbar-width:thin;scrollbar-color:var(--line-strong) transparent;padding:3px}
    .feature-list {display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:3px 4px}
    .feature-chip {display:flex;align-items:center;gap:7px;text-align:left;min-height:33px;padding:5px 6px;border:1px solid transparent;border-radius:6px;background:transparent;color:var(--text);font:520 .85rem/1.4 var(--ui);overflow-wrap:anywhere}
    .feature-chip::before {content:"";width:13px;height:13px;box-sizing:border-box;flex:none;border:1px solid var(--line-strong);border-radius:4px;background:var(--surface)}
    .feature-chip:hover {background:var(--surface-hover)}
    .feature-chip[aria-pressed=true] {background:var(--success-bg);color:var(--teal)}
    .feature-chip[aria-pressed=true]::before {content:"✓";background:var(--teal);border-color:var(--teal);color:var(--on-accent);text-align:center;font:700 10px/11px system-ui}
    #all-features {grid-column:1/-1}
    .filter-footer {display:flex;align-items:center;gap:9px;flex:none;border-top:1px solid var(--line);padding:8px 2px 0}
    .feature-count {margin-right:auto;color:var(--muted);font:.78rem var(--ui);font-variant-numeric:tabular-nums}
    .filter-footer button,.reset-search {min-height:30px;border:0;border-radius:6px;padding:4px 10px;font:600 .8rem var(--ui)}
    #filter-reset {color:var(--teal);background:transparent}
    #filter-reset:hover {background:var(--surface-hover)}
    #filter-done,.reset-search {color:var(--on-accent);background:var(--teal)}
    #filter-done:hover,.reset-search:hover {background:#b1efd3}
    #filter-no-match {padding:12px 5px;color:var(--muted);font-size:.84rem}
    .no-results footer>* {visibility:hidden}
    .button-link[aria-disabled=true] {color:var(--muted);cursor:default}
    .empty-search {position:absolute;inset:0;display:grid;align-content:center;justify-items:center;gap:10px;padding:20px;text-align:center;overflow-wrap:anywhere}
    .surface {position:relative;min-height:0;overflow:hidden;background-color:var(--paper);background-image:radial-gradient(#373c47 .8px,transparent .9px);background-size:20px 20px}
    .surface>noscript {position:absolute;inset:16px auto auto 16px}
    #map {display:block;width:100%;height:100%;touch-action:none;user-select:none;cursor:grab} #map.dragging {cursor:grabbing}
    footer {min-height:49px;padding:6px clamp(10px,2.2vw,30px);background:var(--surface);border-top:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:8px}
    .legend {gap:13px;flex-wrap:wrap;color:var(--text);font-size:.78rem}
    .legend span {display:inline-flex;align-items:center;gap:5px}
    .rail {width:20px;display:inline-block;border-top:2px solid #7e899d}
    .rail.branch {border-top:2px dashed var(--accent)}
    .controls {gap:3px;flex:none;color:var(--text)}.controls button {padding:6px 7px;font-size:.84rem}
    .controls output {min-width:40px;text-align:center;font: .8rem var(--mono);font-variant-numeric:tabular-nums}
    .controls .fit {display:flex;gap:6px;align-items:center;margin-left:4px;border-left:1px solid var(--line);border-radius:0 6px 6px 0;padding-left:11px}
    .controls [aria-disabled=true] {color:var(--muted);cursor:default}
    #drawer-layer {position:fixed;inset:0;z-index:20;isolation:isolate;overflow:hidden}
    #drawer-backdrop {position:absolute;inset:0;background:rgba(6,8,12,.58);opacity:0}
    #inspector {position:absolute;inset:0 0 0 auto;width:min(88%,clamp(360px,38vw,480px));background:var(--surface);border-inline-start:1px solid var(--line);box-shadow:-5px 0 26px #0005;overflow:hidden;display:flex;flex-direction:column;container-type:inline-size;transform:translateX(100%)}
    #drawer-layer.is-open #drawer-backdrop {opacity:1}
    #drawer-layer.is-open #inspector {transform:translateX(0)}
    @media(prefers-reduced-motion:no-preference) {
      #drawer-backdrop {transition:opacity .22s ease}
      #inspector {transition:transform .22s cubic-bezier(.24,.71,.28,1)}
    }
    .panelbar {display:flex;align-items:center;gap:9px;flex:none;min-height:62px;padding:12px 14px 12px 20px;background:var(--surface);border-bottom:1px solid var(--line)}
    #panel-type {flex:none;font-size:.74rem;font-weight:650;color:var(--text);background:var(--surface-raised);border-radius:5px;padding:2px 6px}
    #panel-title {font-size:1.12rem;line-height:1.35;overflow-wrap:anywhere}
    .close,.drawer-tab {display:inline-flex;align-items:center;justify-content:center;gap:4px;color:var(--teal);font:600 .8rem/1.4 var(--ui)}
    .close {flex:none;width:36px;height:36px;margin-left:auto;padding:6px;color:var(--muted)}
    .drawer-tab {position:absolute;top:12px;right:0;z-index:2;min-height:36px;padding:5px 10px;border:1px solid var(--line);border-right:0;border-radius:8px 0 0 8px;background:var(--surface);box-shadow:0 2px 6px #0005}
    .drawer-tab:hover,.close:hover {background:var(--surface-hover)}
    #detail {flex:1;min-height:0;overflow:auto;overscroll-behavior:contain;padding:16px 20px max(20px,env(safe-area-inset-bottom));line-height:1.52;overflow-wrap:anywhere;user-select:text}
    #detail h3 {font-size:.92rem;margin:17px 0 6px;color:var(--text)}
    #detail h4 {font-size:.9rem;margin:8px 0 4px} #detail p+ p {margin-top:6px} #detail p,#detail li,#detail dd {font-size:.9rem}
    #detail ul,#detail ol {padding-left:1.3rem} #detail li+li {margin-top:3px}
    #detail code {font: .86rem var(--mono);background:var(--surface-raised);border-radius:4px;padding:.1rem .27rem;color:var(--blue)}
    #detail dl {display:grid;grid-template-columns:minmax(50px,auto) minmax(0,1fr);gap:5px 10px;margin-top:9px}
    #detail dt {font-size:.8rem;color:var(--muted)} #detail dd {margin:0}
    .record,.choice {border-top:1px solid var(--line);padding:8px 0 5px}
    .queue-item {display:flex;align-items:baseline;flex-wrap:wrap;gap:3px 8px;font-size:.82rem}
    .dim {color:var(--muted)}
    .choice strong {color:var(--amber)} .choice details,.compact-fold {font-size:.86rem;color:var(--muted);margin-top:6px}
    summary {cursor:pointer;color:var(--blue);width:fit-content}
    .link-button {color:var(--blue);padding:.25rem .5rem;background:var(--surface-raised);margin:3px 4px 0 0;font-size:.84rem}
    form {margin-top:15px} form label {display:grid;gap:4px;font-size:.83rem;color:var(--muted)}
    form input {font:inherit;border:1px solid var(--line);border-radius:6px;padding:7px}
    .choose,.refresh {background:var(--accent);color:var(--on-accent);border:0;border-radius:6px;padding:6px 9px;font:inherit;font-size:.83rem;margin:6px 6px 0 0}
    .notice {position:absolute;top:8px;left:50%;transform:translateX(-50%);background:var(--accent-bg);border:1px solid var(--accent);padding:5px 10px;border-radius:7px;z-index:4;font-size:.84rem}
    #inspector>.notice,#endpoint-drawer>.notice,#source-drawer>.notice {position:static;transform:none;flex:none;margin:8px 12px}
    .notice button {margin:0 0 0 6px} .sr {position:absolute;width:1px;height:1px;clip-path:inset(50%);overflow:hidden}
    @media(max-width:790px) {
      header {min-height:59px}.tools {gap:0}
    }
    @media(max-width:510px) {
      header {min-height:54px;padding:7px 10px;gap:4px}.identity {gap:7px}.mark{width:33px;height:33px}.edition{font-size:.68rem}
      .button-link {gap:3px;padding:6px;font-size:.78rem} footer {min-height:45px;gap:4px}
      .legend {gap:6px;font-size:.7rem}.rail {width:13px}.controls {gap:0}.controls button{padding:5px}.controls output{min-width:31px;font-size:.73rem}
    }
    @media(max-width:365px) {.tools .extra {position:absolute;clip-path:inset(50%);width:1px;height:1px;overflow:hidden}}
    .map-bar {position:relative;z-index:5;display:flex;align-items:center;gap:10px;padding:5px clamp(10px,2.4vw,32px);background:var(--surface);border-bottom:1px solid var(--line)}
    .map-modes {display:inline-flex;gap:2px;background:var(--surface-raised);border-radius:8px;padding:3px;flex:none}
    .map-modes button {background:none;border:1px solid transparent;border-radius:6px;color:var(--text);white-space:nowrap;padding:4px 10px;font:600 .84rem/1.5 var(--ui)}
    .map-modes button:hover {background:var(--surface-hover)}
    .map-modes button[aria-pressed=true] {color:var(--on-accent);background:var(--accent);border-color:var(--accent)}
    .controls {margin-left:auto;gap:2px}
    .controls button {display:grid;place-items:center;min-width:32px;min-height:32px;padding:5px}
    .controls .fit {display:flex;margin-left:3px;padding-inline:9px 3px;border-left:1px solid var(--line)}
    .controls #scale {min-width:47px;padding-inline:3px;font:600 .78rem var(--mono)}
    .controls .lock[aria-pressed=true] {color:var(--teal);background:var(--surface-raised);box-shadow:inset 0 0 0 1px var(--line-strong)}
    .lock[aria-pressed=true] .unlocked,.lock[aria-pressed=false] .locked {display:none}
    .controls [aria-disabled=true]:hover {color:var(--muted);background:transparent}
    footer {min-height:31px;padding-block:4px}.canvas-hint {color:var(--muted);font-size:.74rem}
    #detail code {white-space:pre-line}
    #detail .endpoint-list>h3 {margin:0 0 7px;color:var(--ink)}
    .endpoint {display:grid;grid-template-columns:auto minmax(0,1fr) 9px;align-items:center;gap:4px 8px;width:100%;text-align:left;padding:10px 12px;margin:0 0 7px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);line-height:1.4}
    .endpoint:hover,.endpoint[aria-expanded=true] {border-color:var(--line-strong);background:var(--surface)}
    .endpoint::after {content:"";grid-area:1/3;justify-self:center;width:6px;height:6px;border:solid var(--muted);border-width:0 1.5px 1.5px 0;transform:rotate(-45deg)}
    .endpoint-method {font:650 .69rem/1.5 var(--mono);color:var(--teal);background:var(--success-bg);border-radius:4px;padding:1px 5px}
    .endpoint strong {font-size:.94rem}
    #detail code.endpoint-path,.endpoint-body .endpoint-path {display:block;grid-column:1/-1;font:.76rem/1.45 var(--mono);padding:0;background:none;color:var(--muted);overflow-wrap:anywhere}
    #endpoint-drawer,#source-drawer {position:fixed;inset:0 0 0 auto;height:100%;max-height:none;max-width:none;margin:0;padding:0;border:0;background:var(--surface);color:var(--ink);box-shadow:-5px 0 28px #0005;overflow:hidden;overflow-wrap:anywhere}
    #endpoint-drawer {width:min(92%,clamp(360px,42vw,540px))}
    #source-drawer {width:min(calc(100% - 16px),clamp(440px,56vw,780px))}
    #endpoint-drawer[open],#source-drawer[open] {display:flex;flex-direction:column}
    #endpoint-drawer::backdrop,#source-drawer::backdrop {background:rgba(6,8,12,.45)}
    @media(prefers-reduced-motion:no-preference) {
      #endpoint-drawer[open],#source-drawer[open] {animation:endpoint-slide-in .2s ease-out}
      @keyframes endpoint-slide-in {from {transform:translateX(100%)} to {transform:translateX(0)}}
    }
    #endpoint-drawer .panelbar,#source-drawer .panelbar {min-height:51px;padding-block:6px}
    .drawer-nav {flex:none;padding:9px 16px 0}
    .drawer-back,.endpoint-back,#source-back {min-width:0;min-height:34px;padding:5px 7px;background:none;border:0;border-radius:5px;color:var(--teal);font:600 .85rem/1.45 var(--ui);text-align:start;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .drawer-back:hover,.endpoint-back:hover,#source-back:hover {background:var(--surface-hover)}
    .drawer-nav:not([hidden])+.panelbar {min-height:44px;padding-top:0}
    .endpoint-body {min-height:0;overflow:auto;overscroll-behavior:contain;padding:16px 18px max(18px,env(safe-area-inset-bottom))}
    .endpoint-heading {display:flex;gap:8px;align-items:baseline}
    #endpoint-title {font-size:1.08rem;line-height:1.4;margin:0}
    .endpoint-body .endpoint-path {margin:6px 0}
    .endpoint-tabs {position:sticky;top:-1px;display:flex;gap:4px;padding:6px 0;margin:8px 0;background:var(--surface);border-bottom:1px solid var(--line)}
    .endpoint-tabs button {padding:6px 9px;background:transparent;border:0;border-radius:5px;color:var(--muted);font-size:.85rem}
    .endpoint-tabs button[aria-pressed=true] {background:var(--success-bg);color:var(--teal);font-weight:650}
    .contract-field {padding:7px 0}
    .contract-field+.contract-field {border-top:1px solid var(--line)}
    .field-heading {display:flex;flex-wrap:wrap;align-items:baseline;gap:1px 8px}
    #detail .field-heading code,.endpoint-body .field-heading code {padding:0;background:none;font:600 .83rem/1.45 var(--mono);color:var(--ink);min-width:0}
    .field-type {min-width:0;font:.75rem/1.45 var(--mono);color:var(--muted)}
    #detail .contract-field p,.endpoint-body .contract-field p {font-size:.85rem}
    #detail .contract-field .field-constraint,.endpoint-body .contract-field .field-constraint,.endpoint-note {font-size:.8rem;color:var(--muted);margin:2px 0 0}
    .story-goal {color:var(--muted)}
    #detail .acceptance-report>h3 {font-size:.92rem;color:var(--ink);margin:10px 0 6px}
    .acceptance-group {--state-color:var(--accent);border-inline-start:3px solid #916d44;padding:6px 10px;margin:5px 0 8px;background:var(--accent-bg);border-radius:2px 8px 8px 2px}
    .acceptance-group[data-state="passed"] {--state-color:var(--teal);border-color:#647a6d;background:var(--success-bg)}
    #detail .acceptance-group h4 {font-size:.8rem;color:var(--state-color);margin:0 0 3px;line-height:1.5}
    .case-row {display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:baseline;gap:0 10px;padding-block:3px}
    .case-row+.case-row {border-top:1px solid var(--line);margin-top:3px;padding-top:5px}
    #detail .case-title {font-size:.94rem;line-height:1.45;font-weight:650;color:var(--ink)}
    #detail .case-outcome {grid-column:1;font-size:.85rem;line-height:1.43;margin:1px 0;color:var(--text)}
    #detail .case-scope {text-align:end;font-size:.76rem;font-weight:550;color:var(--state-color);max-width:12em}
    .case-row .case-proof {font-size:.77rem;margin:0;justify-self:end}
    .case-proof summary {color:var(--muted)}
    .case-row .case-proof[open] {grid-column:1 / -1;justify-self:stretch;margin-top:4px}
    .case-proof[open]>summary {margin-left:auto}
    @container (max-width:365px) {
      .case-row {grid-template-columns:minmax(0,1fr) auto}
      #detail .case-title,#detail .case-outcome {grid-column:1 / -1}
      #detail .case-scope {grid-column:1;grid-row:3;text-align:start}
      .case-row .case-proof {grid-column:2;grid-row:3}
      .case-row .case-proof[open] {grid-row:4}
    }
    .story-tools {display:flex;align-items:baseline;flex-wrap:wrap;gap:3px 12px;border-top:1px solid var(--line);margin-top:12px;padding-top:8px}
    .story-tools>.compact-fold {margin:0}
    .story-tools>.compact-fold[open] {flex-basis:100%;padding-bottom:6px}
    .story-tools summary,.inspect-feature {font:550 .82rem/1.55 var(--ui);color:var(--teal);padding:3px 0}
    .inspect-feature {background:none;border:0}
    .inspect-feature::after {content:" →"}
    .inspect-feature:hover,.story-tools summary:hover {text-decoration:underline}
    details>summary:focus-visible {outline:2px solid var(--blue);outline-offset:2px;border-radius:3px}
    .source-editor-label {display:flex;align-items:center;gap:6px;margin:5px 0 8px;font:500 .76rem/1.5 var(--ui);color:var(--muted)}
    .source-editor {font:inherit;color:var(--ink);border:1px solid var(--line);border-radius:5px;background:var(--surface,var(--surface));padding:3px 4px}
    .source-entry {position:relative;border-block-start:1px solid var(--line);padding:4px 0}
    .source-entry .source-file {margin:0}
    .source-entry .source-file>summary {width:fit-content;max-width:calc(100% - 100px);overflow-wrap:anywhere;line-height:1.55;min-height:24px}
    .source-entry .source-open {color:var(--teal);text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px}
    .source-entry .source-open:focus-visible,.source-actions button:focus-visible {outline:2px solid var(--blue);outline-offset:1px}
    .source-actions {position:absolute;inset:3px 0 auto auto;display:flex;align-items:center;gap:2px}
    .source-actions button {font:550 .76rem/1.5 var(--ui);color:var(--teal);cursor:pointer;padding:4px 5px;min-height:26px;border:0;background:transparent}
    .source-actions button:hover {text-decoration:underline}
    .source-manual-copy {width:100%;font:.78rem/1.5 var(--mono)}
    .source-entry .source-unavailable {font-size:.77rem;color:var(--muted);margin:3px 0}
    .source-reader-body {flex:1;min-height:0;overflow:auto;overscroll-behavior:contain;padding:20px clamp(14px,3vw,28px) max(24px,env(safe-area-inset-bottom))}
    #source-title {font-size:1.16rem;line-height:1.45;overflow-wrap:anywhere}
    .source-reader-path {margin-top:6px;color:var(--muted);font:.8rem/1.55 var(--mono);overflow-wrap:anywhere}
    .source-reader-position {font:650 .9rem/1.4 var(--ui);color:var(--teal)}
    .source-reader-status {margin-block:12px;color:var(--muted);font-size:.9rem}
    .source-reader-tools {display:flex;align-items:center;gap:6px 10px;flex-wrap:wrap;margin:14px 0 18px}
    .source-reader-tools .source-editor-label {margin:0}
    .source-reader-tools button,.source-reader-tools a {border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--teal);font:600 .8rem/1.5 var(--ui);padding:5px 9px;text-decoration:none}
    .source-reader-tools a:hover,.source-reader-tools button:hover {background:var(--surface-hover)}
    .source-reader-body .source-preview {margin:10px 0 0;padding:7px 0;background:var(--paper);border:1px solid var(--line);border-radius:8px;color:var(--ink);font:.86rem/1.7 var(--mono);tab-size:2;white-space:pre-wrap}
    .source-code-line {display:grid;grid-template-columns:minmax(4ch,max-content) minmax(0,1fr);align-items:baseline;padding:3px 12px 3px 0}
    .source-code-line>span:last-child {min-width:0;overflow-wrap:anywhere}
    .source-target-line {background:var(--success-bg);box-shadow:inset 3px 0 var(--teal)}
    .source-line-number {user-select:none;text-align:right;padding:0 9px;color:var(--muted);font-variant-numeric:tabular-nums}
    .lesson-group[open] {width:100%}
    .lesson-record {padding:13px 0;border-top:1px solid var(--line)}
    .lesson-meta,.lesson-origin {display:flex;align-items:baseline;flex-wrap:wrap;gap:4px 8px}
    .lesson-meta {color:var(--muted);font-size:.78rem;margin-bottom:5px}
    .lesson-version {font:500 .74rem var(--mono)}
    .lesson-state {margin-left:auto;font-weight:650}
    .lesson-state[data-state="approved"] {color:var(--teal)}
    .lesson-state[data-state="retired"],.lesson-lifecycle {color:var(--amber)}
    .lesson-title {display:block;font-size:.98rem;line-height:1.5}
    .lesson-reason {margin:8px 0;padding:7px 10px;border-inline-start:2px solid var(--teal);background:var(--paper)}
    #detail .lesson-reason p {margin:3px 0 0}
    .lesson-reason strong,.lesson-origin {font-size:.8rem}
    .lesson-origin {align-items:center;justify-content:space-between;margin:7px 0}
    .lesson-origin .link-button {color:var(--teal);font-weight:600;text-decoration:underline;text-underline-offset:3px}
    @media(max-width:480px) {
      #inspector {width:calc(100% - 28px)}
      #endpoint-drawer {width:calc(100% - 10px)}
      #source-drawer {width:100%}
    }
    .source-note {white-space:pre-line;font: .78rem/1.65 var(--mono);overflow-wrap:anywhere}
    .no-results .controls,.no-results footer {visibility:hidden}
    @media(max-width:700px) {.controls .fit span {display:none}.controls .fit {padding:5px 7px}.tools .button-link {font-size:.77rem}}
    @media(max-width:420px) {.map-modes button {padding-inline:7px}.map-bar {padding-inline:7px;gap:4px}.controls {gap:0}.controls button{min-width:30px}.controls .fit {margin-left:1px}.tools .button-link {font-size:0;gap:0}.tools .button-link svg {width:18px;height:18px}.identity {flex:1}}
    @media(max-width:640px) {
      .feature-bar {position:static}
      .filter-popover {top:calc(100% + 4px);left:clamp(8px,calc(100% - 354px),150px);width:min(344px,calc(100% - 16px))}
    }
    @media(max-width:510px) {
      .map-bar {gap:6px;padding-inline:8px}
      .filter-toggle {gap:5px;padding-inline:8px}
      .map-modes button {padding-inline:7px}
    }
    @media(max-width:400px) {
      .mode-prefix {display:none}
      .map-modes button {padding-inline:6px}
      .filter-toggle {gap:4px;padding-inline:6px}
      .controls #scale {min-width:37px}
      .controls button {min-width:28px}
    }
    @media(max-height:420px) {.filter-popover {gap:5px;padding:8px;max-height:calc(100dvh - 108px)}}
    @media(max-width:360px) {
      .filter-toggle {padding-inline:5px}
      .filter-toggle .filter-caret,.filter-toggle>svg:first-child {display:none}
      .filter-toggle[data-filtered=false] #filter-summary {display:none}
      .filter-toggle[data-filtered=false] .filter-short {display:inline}
    }
    @media(max-width:330px) {.controls {gap:0}.legend {font-size:.67rem}.canvas-hint {font-size:.66rem}}
    @media(prefers-reduced-motion:reduce) {*{scroll-behavior:auto!important}}
  </style>
</head>
<body>
<div class="app">
<div class="app-head">
<header>
  <div class="identity"><span class="mark" aria-hidden="true"><svg viewBox="0 0 28 28" fill="none"><path d="M5 14h7m0 0c3 0 1-7 6-7h5m-11 7c3 0 1 7 6 7h5" stroke="#b4e8da" stroke-width="2.1"/><circle cx="5" cy="14" r="3.1" fill="#fff"/><circle cx="23" cy="7" r="2.7" fill="#8cd5c7"/><circle cx="23" cy="21" r="2.7" fill="#8cdebb"/></svg></span><div><div class="graph-crumb"><a id="catalog-home" href="/" aria-label="返回需求中心" hidden><svg viewBox="0 0 16 16" aria-hidden="true"><path d="m9 4-4 4 4 4"/></svg>需求中心</a><span id="edition-kind">需求全景图 · @@KIND@@</span><span class="edition">v@@VERSION@@</span></div><h1 title="@@TITLE@@">@@TITLE@@</h1></div></div>
  <div class="tools"><button type="button" class="button-link" id="export" title="保存完整、可放大的 SVG 图"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12m-4-4 4 4 4-4M4 15v4a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-4"/></svg><span id="export-caption">导出整图</span></button><a id="ai-record" href="model.json" class="button-link" title="读取同一版需求的 JSON"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m8 7-5 5 5 5m8-10 5 5-5 5m-3-13-2 16"/></svg>AI 记录</a></div>
</header>
  <div class="map-bar">
    <div id="map-modes" role="group" aria-label="视图" class="map-modes">
      <button type="button" id="overview-mode" aria-pressed="true" aria-label="功能总览"><span class="mode-prefix">功能</span>总览</button>
      <button type="button" id="detail-mode" aria-pressed="false" aria-label="实现链路"><span class="mode-prefix">实现</span>链路</button>
    </div>
    <div class="feature-bar" id="feature-bar" hidden>
      <button class="filter-toggle" id="filter-toggle" type="button" aria-label="筛选功能" aria-expanded="false" aria-controls="filter-popover" aria-haspopup="dialog">
        <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M2.5 6h6m4 0h5m-15 8h2m4 0h9"/><circle cx="10.5" cy="6" r="2"/><circle cx="6.5" cy="14" r="2"/></svg>
        <span id="filter-summary">筛选功能</span><span class="filter-short" aria-hidden="true">筛选</span><span id="filter-badge" hidden></span>
        <svg class="filter-caret" viewBox="0 0 12 12" aria-hidden="true"><path d="m2.5 4.5 3.5 3.5 3.5-3.5"/></svg>
      </button>
      <section class="filter-popover" id="filter-popover" role="dialog" aria-label="筛选功能" hidden>
        <label class="feature-search"><svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="8" cy="8" r="5"/><path d="m12 12 4.5 4.5"/></svg><input type="search" id="feature-query" aria-label="搜索功能点" placeholder="搜索功能点" autocomplete="off" maxlength="80"></label>
        <div class="filter-scroll">
          <div id="feature-list" class="feature-list" role="group" aria-label="选择功能点，可多选"><button type="button" id="all-features" class="feature-chip" aria-pressed="true">全部功能</button></div>
          <p id="filter-no-match" hidden>没有匹配的功能</p>
        </div>
        <div class="filter-footer">
          <output id="feature-count" class="feature-count" aria-live="polite"></output>
          <button type="button" id="filter-reset" hidden>清除筛选</button>
          <button type="button" id="filter-done">完成</button>
        </div>
      </section>
    </div>
    <div class="controls" id="map-tools" role="group" aria-label="画布工具">
      <button id="minus" type="button" aria-label="缩小" title="缩小"><svg viewBox="0 0 24 24"><path d="M5 12h14"/></svg></button>
      <button id="scale" type="button" aria-label="恢复 100% 阅读视图" title="恢复 100% 并回到阅读起点">100%</button>
      <button id="plus" type="button" aria-label="放大" title="放大"><svg viewBox="0 0 24 24"><path d="M5 12h14m-7-7v14"/></svg></button>
      <button class="lock" id="zoom-lock" type="button" aria-pressed="true" aria-label="锁定手势缩放" title="手势缩放已锁定，点击解锁"><svg viewBox="0 0 24 24"><rect x="5" y="10.5" width="14" height="10" rx="2.3"/><path class="locked" d="M8 10.5V7a4 4 0 0 1 8 0v3.5"/><path class="unlocked" d="M8 10.5V7a4 4 0 0 1 7.6-1.7"/><path d="M12 14.5v2.2"/></svg></button>
      <button class="fit" id="fit" type="button" aria-label="适应画布" title="把当前视图的全部节点放入画布"><svg viewBox="0 0 24 24"><path d="M9 4H4v5m11-5h5v5M4 15v5h5m11-5v5h-5"/></svg><span>适应画布</span></button>
    </div>
  </div>
</div>
<main class="surface" aria-label="需求关系画布">
  <p id="map-help" class="sr">箭头连接故事、接口、处理和验收。点击卡片或按回车查看详情。拖动画布可平移。手势缩放默认锁定，可用右上角按钮调整比例。</p>
  <svg id="map" xmlns="http://www.w3.org/2000/svg" tabindex="0" role="group" aria-label="需求关系图" aria-describedby="map-help">
    <defs id="drawing-defs"><style id="graph-style">
      .map-node {cursor:pointer;outline:none}.map-node text,.map-label {font-family:"Instrument Sans","PingFang SC","Microsoft YaHei",system-ui,sans-serif;pointer-events:none}
      .map-node .n-title{font-weight:680;letter-spacing:-.3px}.map-node .n-label{font-weight:600;letter-spacing:.15px}
      .map-node .mono{font-family:"IBM Plex Mono","SFMono-Regular",Consolas,monospace;letter-spacing:-.3px}
      .map-line {fill:none;stroke-linecap:round;stroke-linejoin:round}
      .map-node:hover .outline,.map-node:focus-visible .outline,.map-node.selected .outline {stroke:#ffc184;stroke-width:3}
      .map-node.muted,.map-edge.muted {opacity:.27}.map-node.selected .n-title {font-weight:760}
    </style></defs>
    <g id="world"><g id="wires"></g><g id="wire-labels"></g><g id="stations"></g></g>
  </svg>
  <div class="empty-search" id="empty-search" hidden><strong id="empty-label"></strong><button type="button" class="reset-search" id="clear-search">清空搜索</button></div>
  <noscript>打开交互图需要启用 JavaScript。可以从页头读取同一版 AI 记录。</noscript>
  <button id="reopen-panel" class="drawer-tab" type="button" aria-label="展开详情" title="展开所选节点的详情" aria-controls="inspector" aria-expanded="false" hidden>
    <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M15 4v16m-4-11-3 3 3 3"/></svg>详情
  </button>
  <div id="notice" hidden class="notice" role="status">记录已更新。<button class="refresh" id="refresh" type="button">读取最新版</button></div>
</main>
<footer>
  <div class="legend" aria-label="连线图例"><span><i class="rail"></i><span id="relation-label">包含功能</span></span><span id="branch-legend" hidden><i class="rail branch"></i>条件分支</span></div>
  <span class="canvas-hint">拖动平移 · 点击卡片查看详情</span>
</footer>
</div>
<div id="drawer-layer" hidden>
  <div id="drawer-backdrop" aria-hidden="true"></div>
  <aside id="inspector" role="dialog" aria-modal="true" aria-labelledby="panel-title" tabindex="-1" hidden>
    <div class="panelbar"><span id="panel-type"></span><h2 id="panel-title"></h2><button class="close" id="close-panel" type="button" aria-label="关闭详情" title="关闭详情（Esc）"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M6 18 18 6"/></svg></button></div>
    <div id="detail"></div>
  </aside>
</div>
<script type="application/json" id="data">@@DATA@@</script>
<script>@@DAGRE@@</script>
<script>@@SCRIPT@@</script>
</body></html>
