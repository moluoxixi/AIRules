<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <title>需求中心 · 需求全景图</title>
  <script>@@THEME_SCRIPT@@</script>
  <link rel="expect" blocking="render" href="#catalog-ready">
  <script>
    (() => {
      let activeCard
      function prepareCardTransition(event, entry, outgoing) {
        if (activeCard) {
          activeCard.style.removeProperty('view-transition-name')
          activeCard = undefined
        }
        const transition = event.viewTransition
        if (!transition) return
        const peer = entry?.url && new URL(entry.url)
        const link = peer?.origin === location.origin && [...document.querySelectorAll('.card h3 a[href]')]
          .find(target => target.pathname === peer.pathname)
        if (!link || matchMedia('(prefers-reduced-motion: reduce)').matches) {
          transition.skipTransition()
          return
        }
        window.FlowTooltip?.hide()
        const card = link.closest('.card')
        activeCard = card
        card.style.viewTransitionName = 'requirement-surface'
        const clearName = () => {
          if (activeCard !== card) return
          card.style.removeProperty('view-transition-name')
          activeCard = undefined
        }
        const captured = outgoing ? transition.finished : transition.ready
        captured.then(clearName, clearName)
      }
      addEventListener('pageswap', event => prepareCardTransition(event, event.activation?.entry, true))
      addEventListener('pagereveal', event => prepareCardTransition(event, window.navigation?.activation?.from, false))
    })()
  </script>
  <style>
    @@THEME@@
    @view-transition { navigation:auto }
    :root {
      --catalog-landscape:url('/catalog-landscape-night.jpg');
      font:15px/1.5 var(--ui); color:var(--ink); background:var(--paper);
    }
    :root[data-theme=light] { --catalog-landscape:url('/catalog-landscape.jpg') }
    *,*::before,*::after { box-sizing:border-box }
    body,h1,h2,h3,p,ul { margin:0 }
    html { scroll-padding-top:60px }
    body {
      min-height:100vh;
      background:radial-gradient(ellipse at 18% -10rem,var(--surface),transparent 62rem),var(--paper);
    }
    [hidden] { display:none!important }
    button,input { font:inherit; color:inherit }
    button,a { -webkit-tap-highlight-color:transparent }
    button { cursor:pointer }
    :focus-visible { outline:2px solid var(--focus-ring); outline-offset:3px }
    .wrap { width:min(1160px,calc(100% - clamp(28px,8.5vw,124px))); margin-inline:auto }
    .masthead {
      position:sticky; z-index:5; top:0; border-block-end:1px solid var(--line);
      background:var(--glass); backdrop-filter:blur(14px);
    }
    .masthead .wrap { display:flex; align-items:center; justify-content:space-between; gap:12px; min-height:43px; padding-block:5px }
    .identity,.brand,.workspace,.metrics,.inventory { display:flex; align-items:center; min-width:0 }
    .identity { gap:11px; max-width:100% }
    .brand {
      flex:none; justify-content:center; width:28px; height:28px; border:1px solid var(--accent); border-radius:4px;
      color:var(--on-accent); background:var(--accent);
    }
    .brand:hover { background:var(--ink); border-color:var(--ink) }
    .brand svg { width:18px; height:18px }
    .workspace { gap:7px; color:var(--text); font-size:.82rem }
    .workspace .glyph { width:14px; height:14px; color:var(--muted) }
    .workspace span { min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap }
    .glyph { display:block; flex:none; width:18px; height:18px; fill:none; stroke:currentColor; stroke-width:1.55; stroke-linecap:round; stroke-linejoin:round }
    .icon-defs { display:none }
    main { padding-block:16px 40px }
    .intro {
      --scroll-height:clamp(145px,16vw,186px);
      position:relative; isolation:isolate; display:grid; align-content:center; justify-items:start; gap:10px;
      min-height:var(--scroll-height); padding:15px clamp(15px,3.2vw,39px);
      border-block:1px solid var(--line); background:linear-gradient(95deg,var(--surface),var(--surface-raised) 74%);
    }
    .intro::before {
      content:""; position:absolute; z-index:-1; inset:0 0 0 auto; pointer-events:none;
      width:min(76%,calc(var(--scroll-height) * 3)); background:var(--catalog-landscape) right bottom / cover no-repeat;
      mask-image:linear-gradient(90deg,transparent,black 37%);
    }
    .intro::after {
      content:""; position:absolute; inset-block-end:-1px; inset-inline-start:clamp(15px,3.2vw,39px);
      width:clamp(24px,4vw,54px); height:2px; background:var(--accent);
    }
    #page-title {
      font:800 clamp(2.55rem,4.3vw,3.65rem)/1.15 var(--display);
      letter-spacing:.07em; white-space:nowrap;
    }
    .metrics {
      align-items:stretch; gap:clamp(12px,1.8vw,25px); color:var(--muted); white-space:nowrap;
    }
    .inventory { align-items:stretch; gap:inherit }
    .inventory > span,.overview {
      display:grid; align-content:center; gap:1px; padding-inline-start:clamp(8px,1.3vw,18px); border-inline-start:1px solid var(--line);
    }
    .overview { border-color:var(--accent) }
    .metric-label,.overview-label { font-size:.72rem; line-height:1.3 }
    .metrics b,.overview-count { font:700 1.18rem/1.25 var(--mono); font-variant-numeric:tabular-nums }
    .inventory b { color:var(--ink) }
    .overview-count { color:var(--muted) }
    .overview-count b { color:var(--accent) }
    .overview-label { grid-row:2 }
    .overview .meter { grid-row:3; height:3px; margin-block-start:2px }
    .overview .meter[data-segmented]::after {
      content:""; position:absolute; inset:0; pointer-events:none;
      background:repeating-linear-gradient(90deg,transparent 0 calc(var(--meter-step) - 1px),var(--paper) calc(var(--meter-step) - 1px) var(--meter-step));
    }
    .toolbar { display:flex; justify-content:space-between; align-items:center; gap:10px; margin-block:16px 17px }
    .filters { display:inline-flex; align-items:stretch; gap:4px }
    .filters button {
      display:inline-flex; align-items:center; justify-content:center; min-height:34px; padding:3px 14px;
      border:1px solid var(--line); border-radius:3px; background:transparent; color:var(--text); white-space:nowrap;
      font-size:.82rem; font-weight:650;
    }
    .filters button:hover { background:var(--surface-hover); color:var(--ink) }
    .filters button[aria-pressed=true] { color:var(--on-accent); background:var(--accent); border-color:var(--accent) }
    .search {
      display:flex; align-items:center; gap:8px; min-width:0; width:min(290px,100%); height:34px; padding:0 10px;
      border:1px solid var(--line-strong); border-radius:5px; background:var(--surface); color:var(--muted);
    }
    .search:focus-within { border-color:var(--accent); box-shadow:0 0 0 2px var(--accent-bg) }
    .search .glyph { width:16px; height:16px }
    .search input { width:100%; min-width:0; padding:0; background:transparent; border:0; appearance:none; outline:none; color:var(--ink); font-size:.84rem }
    .search input::placeholder { color:var(--muted) }
    .search input::-webkit-search-cancel-button { display:none }
    .search button { display:grid; place-items:center; padding:4px; border:0; border-radius:3px; background:transparent; color:var(--text) }
    .search button:hover { background:var(--surface-hover) }
    .refresh-notice {
      display:flex; align-items:center; flex-wrap:wrap; gap:8px; margin:0 0 16px; padding:8px 11px;
      border:1px solid var(--line-strong); border-inline-start:2px solid var(--amber); border-radius:5px;
      color:var(--amber); background:var(--surface); font-size:.82rem;
    }
    .refresh-notice button { padding:3px 6px; color:var(--accent); text-decoration:underline; text-underline-offset:3px; font-weight:650; border:0; border-radius:3px; background:transparent }
    .results { scroll-margin-top:16px }
    .section+.section { margin-top:21px }
    .section-head { display:flex; align-items:center; gap:11px; min-height:21px; margin:0 0 9px }
    .section-label,.section-head h2 { display:flex; align-items:center; gap:7px }
    .section-head h2 { font:700 1.2rem/1.25 var(--display); letter-spacing:.035em }
    .section-head .glyph { width:15px; height:15px; color:var(--accent) }
    .section[data-bucket=archive] .section-head .glyph { color:var(--muted) }
    .section-total { color:var(--muted); padding-inline:3px; font:.74rem var(--mono); font-variant-numeric:tabular-nums }
    .section-head::after { content:""; flex:1; height:1px; background:var(--line) }
    .cards { display:grid; gap:9px }
    .card {
      position:relative; min-width:0; padding:10px 13px 11px; isolation:isolate;
      border:1px solid var(--line);
    }
    .card[data-bucket=active] { display:flex; flex-direction:column; border-radius:3px; background:var(--surface); box-shadow:0 1px 2px var(--grid) }
    .card:is(:hover,:active,:focus-within) { z-index:1; border-color:var(--accent) }
    .card:has(a:focus-visible),.card:focus-visible { outline:2px solid var(--focus-ring); outline-offset:2px }
    .section[data-bucket=archive] .cards { gap:0; border:1px solid var(--line); border-radius:4px }
    .card[data-bucket=archive] { padding-block:8px 9px; border-color:transparent; border-radius:0; background:transparent }
    .card[data-bucket=archive]+.card { border-block-start-color:var(--line) }
    .card[data-bucket=archive]:is(:first-child,:last-child) { border-radius:3px }
    .card[data-bucket=archive]:is(:hover,:active,:focus-within) { border-color:var(--accent) }
    .card-top,.card-meta,.card-type,.state { display:flex; align-items:center; min-width:0 }
    .card-top { justify-content:space-between; gap:5px 8px; flex-wrap:wrap }
    .card-meta { gap:9px; margin-inline-start:auto; color:var(--muted); white-space:nowrap }
    .card-type { gap:4px; font-size:.73rem }
    .card-type .glyph { width:13px; height:13px; color:var(--blue) }
    .card-type[data-kind=research] .glyph { color:var(--teal) }
    .card-time { font:.69rem/1.25 var(--mono); font-variant-numeric:tabular-nums }
    .card-open { display:grid; place-items:center; width:21px; height:21px; color:var(--ink) }
    .card-open .glyph { width:15px; height:15px }
    .card:is(:hover,:focus-within) .card-open { color:var(--accent) }
    .state {
      --state-ink:var(--teal);
      gap:5px; padding:3px 5px; border:1px solid color-mix(in srgb,var(--state-ink) 35%,transparent); border-radius:3px;
      color:var(--state-ink); font-size:.72rem; line-height:1.15; font-weight:650;
    }
    .state::before { content:""; width:5px; height:5px; flex:none; background:currentColor; transform:rotate(45deg) }
    .state[data-tone=amber] { --state-ink:var(--amber) }
    .state[data-tone=neutral] { --state-ink:var(--muted) }
    .card h3 { margin-top:5px; min-width:0; color:var(--ink); font-size:1.12rem; line-height:1.3; font-weight:690; letter-spacing:.01em }
    .card[data-bucket=archive] h3 { color:var(--text); font-size:1rem }
    .card h3 a { display:block; color:inherit; text-decoration:none; outline:none }
    .card h3 a::after { content:""; position:absolute; inset:0; z-index:1; border-radius:inherit }
    .card-title,.card-summary { display:block; min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis }
    .card-summary { margin-top:4px; color:var(--muted); font-size:.82rem; line-height:1.4 }
    .card-tags { display:flex; align-items:center; flex-wrap:wrap; gap:4px; margin-top:7px; padding:0; list-style:none }
    .card-tag {
      min-width:0; max-width:100%; overflow-wrap:anywhere;
      padding:1px 5px; border:1px solid var(--line); border-radius:3px; color:var(--text);
      font-size:.72rem; line-height:1.4;
    }
    .card-tag[data-matched] { color:var(--on-accent); background:var(--accent); border-color:var(--accent) }
    .card-progress { display:flex; align-items:center; gap:9px; min-width:0; min-height:12px; margin-top:7px }
    .card[data-bucket=active] .card-progress { margin-top:auto; min-height:20px; padding-top:7px }
    .card-progress .meter { flex:1 }
    .fraction { color:var(--text); font:.73rem/1 var(--mono); font-variant-numeric:tabular-nums; white-space:nowrap }
    .card-error { margin-top:8px; color:var(--amber); font-size:.83rem; overflow-wrap:anywhere }
    .meter { position:relative; height:4px; overflow:hidden; --track:var(--line); --fill:var(--accent) }
    .meter progress { display:block; width:100%; height:100%; margin:0; border:none; appearance:none; background:var(--track); color:var(--fill) }
    .meter progress::-webkit-progress-bar { background:var(--track) }
    .meter progress::-webkit-progress-value { background:var(--fill) }
    .meter progress::-moz-progress-bar { background:var(--fill) }
    .meter[data-known=false] { background:repeating-linear-gradient(120deg,transparent 0 4px,var(--line-strong) 4px 5px) }
    .meter[data-known=false] progress { opacity:0 }
    .empty { display:grid; justify-items:center; gap:6px; padding:35px 14px; border:1px dashed var(--line-strong); border-radius:5px; background:var(--surface); text-align:center }
    .empty h2 { font-size:1rem }
    .empty p { color:var(--muted); font-size:.86rem }
    .empty button { margin-top:7px; padding:6px 11px; border:1px solid var(--line-strong); border-radius:3px; background:var(--accent-bg); color:var(--accent); font-size:.8rem; font-weight:650 }
    .empty button:hover { background:var(--surface-hover) }
    .sr { position:absolute; width:1px; height:1px; padding:0; overflow:hidden; clip-path:inset(50%); white-space:nowrap }
    @media (min-width:700px) {
      .section[data-bucket=active] .cards { grid-template-columns:repeat(2,minmax(0,1fr)) }
      .card[data-bucket=active]:last-child:nth-child(odd) { grid-column:1 / -1 }
      .card[data-bucket=archive] { display:grid; grid-template-columns:minmax(0,1fr) minmax(0,auto); column-gap:16px; align-items:center }
      .card[data-bucket=archive] .card-top { grid-column:2; grid-row:1; justify-self:end }
      .card[data-bucket=archive] h3 { grid-column:1; grid-row:1; margin-top:0 }
      .card[data-bucket=archive] .card-summary,.card[data-bucket=archive] .card-error { grid-column:1 / -1 }
      .card[data-bucket=archive] .card-progress { grid-column:2; min-width:105px }
    }
    @media (min-width:1080px) {
      .results:has([data-bucket=active]):has([data-bucket=archive]) {
        display:grid; align-items:start; grid-template-columns:minmax(0,1fr) minmax(290px,29%); column-gap:26px;
      }
      .results:has([data-bucket=active]):has([data-bucket=archive]) .section + .section { margin-top:0 }
      .section[data-bucket=active] .cards { grid-template-columns:minmax(0,1fr); gap:10px }
      .card[data-bucket=active] { padding:12px 16px }
      .card[data-bucket=active] h3 { font-size:1.27rem }
      .card[data-bucket=active] .card-summary { font-size:.88rem }
      .results:has([data-bucket=active]) .section[data-bucket=archive] {
        border-inline-start:1px solid var(--line); padding-inline-start:19px;
      }
      .results:has([data-bucket=active]) .card[data-bucket=archive] { display:block; padding:10px }
      .results:has([data-bucket=active]) .card[data-bucket=archive] h3 { margin-top:5px }
    }
    @media (min-width:700px) {
      .metrics { gap:clamp(14px,2.4vw,32px) }
      .metrics b,.overview-count { font-size:1.58rem; line-height:1.15 }
      .overview .meter { height:4px }
    }
    @media (max-width:699px) {
      #page-title { font-size:clamp(2.15rem,7.4vw,2.8rem) }
      .intro { --scroll-height:135px; gap:9px; padding-block:12px }
      .intro::before { width:65%; background-position:74% bottom; mask-image:linear-gradient(90deg,transparent,black 70%) }
      .toolbar { margin-block:12px 10px }
      .section-head { margin-block-end:7px }
      .filters button { padding-inline:8px }
    }
    @media (max-width:560px) {
      .metrics { gap:8px; padding-inline-start:0 }
      .inventory > span,.overview { padding-inline-start:7px }
      .metrics b,.overview-count { font-size:1rem }
      .metric-label,.overview-label { font-size:.66rem }
    }
    @media (max-width:390px) {
      .toolbar { gap:7px }
      .metrics b,.overview-count { font-size:.89rem }
      .search { padding-inline:7px; gap:5px }
      .card { padding-inline:10px }
      .card-meta { gap:6px }
    }
    @media (prefers-reduced-motion:no-preference) {
      #page-title { animation:catalog-enter .35s .04s both }
      .metrics { animation:catalog-enter .35s .10s both }
      .toolbar { animation:catalog-enter .35s .16s both }
      .results,.empty { animation:catalog-fade .44s .20s both }
      .intro::after { transform-origin:left; animation:catalog-rule .5s cubic-bezier(.19,1,.22,1) both }
      .intro::before { animation:scroll-unfurl .74s .05s cubic-bezier(.19,1,.22,1) both }
      .card,.brand,.filters button,.search { transition:border-color .16s ease,background-color .16s ease,color .16s ease }
      .card-open { transition:color .16s ease,transform .18s ease }
      @media (hover:hover) {
        .card:hover .card-open { transform:translateX(2px) }
      }
      @supports (animation-timeline:scroll()) {
        .masthead::after { content:""; position:absolute; inset:auto 0 -1px; height:1px; pointer-events:none;
          background:var(--accent); transform:scaleX(0); transform-origin:left;
          animation:reading-progress linear both; animation-timeline:scroll(root block) }
        @keyframes reading-progress { to { transform:scaleX(1) } }
      }
      @keyframes catalog-enter { from { opacity:.35; transform:translateY(4px) } }
      @keyframes catalog-fade { from { opacity:.35 } }
      @keyframes catalog-rule { from { transform:scaleX(0) } }
      @keyframes scroll-unfurl { from { clip-path:inset(0 0 0 100%); opacity:.1 } to { clip-path:inset(0); opacity:1 } }
    }
    @media (forced-colors:active) {
      .masthead::after,.overview .meter::after { display:none }
      .card:is(:hover,:active,:focus-within),.filters button[aria-pressed=true],.card-tag[data-matched] { border-color:Highlight }
      .meter { border:1px solid CanvasText }
      .meter[data-known=false] { border-style:dashed }
      .meter[data-known=true] progress { appearance:auto }
    }
  </style>
</head>
<body>
  <svg class="icon-defs" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><defs>
    <symbol id="folder" viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h5l2 2h7a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></symbol>
    <symbol id="feature" viewBox="0 0 24 24"><path d="m12 3 9 5-9 5-9-5 9-5zm-9 9 9 5 9-5M3 16l9 5 9-5"/></symbol>
    <symbol id="research" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m15.5 15.5 5 5"/></symbol>
    <symbol id="active" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M12 7.5V12l3 2"/></symbol>
    <symbol id="archive" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="5" rx="1.5"/><path d="M5 9v10h14V9m-9 4h4"/></symbol>
    <symbol id="arrow" viewBox="0 0 24 24"><path d="M5 12h13m-5-5 5 5-5 5"/></symbol>
    <symbol id="clear" viewBox="0 0 24 24"><path d="m7 7 10 10m0-10L7 17"/></symbol>
  </defs></svg>
  <header class="masthead"><div class="wrap">
    <div class="identity">
      <a class="brand" id="catalog-home" href="?" aria-label="首页"><svg viewBox="0 0 32 32" fill="none" aria-hidden="true"><path d="M6 16h7c6 0 3-8 10-8h3m-14 8c6 0 4 8 10 8h4" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/><circle cx="5" cy="16" r="3" fill="currentColor"/><circle cx="26" cy="8" r="3" fill="currentColor"/><circle cx="26" cy="24" r="3" fill="currentColor"/></svg></a>
      <span class="workspace"><svg class="glyph" aria-hidden="true"><use href="#folder"/></svg><span id="project-name"></span></span>
    </div>
    <button type="button" class="theme-toggle" data-theme-toggle hidden></button>
  </div></header>
  <main class="wrap">
    <div class="intro">
      <h1 id="page-title">需求中心</h1>
      <div class="metrics" role="group" aria-label="需求统计">
        <p class="inventory" id="inventory"></p>
        <div id="overview" class="overview" hidden></div>
      </div>
    </div>
    <div class="toolbar">
      <div class="filters" role="group" aria-label="需求范围">
        <button type="button" data-scope="all" aria-pressed="true">全部</button>
        <button type="button" data-scope="active" aria-pressed="false">进行中</button>
        <button type="button" data-scope="archive" aria-pressed="false">已归档</button>
      </div>
      <div class="search"><svg class="glyph" aria-hidden="true"><use href="#research"/></svg>
        <input id="catalog-query" type="search" aria-label="搜索需求" placeholder="搜索需求或标签" autocomplete="off">
        <button id="clear-query" type="button" aria-label="清除搜索" hidden><svg class="glyph" aria-hidden="true"><use href="#clear"/></svg></button>
      </div>
    </div>
    <div class="refresh-notice" id="refresh-notice" hidden><span role="status">暂时无法更新，正在显示上次读取的需求。</span><button id="retry" type="button">重试</button></div>
    <p class="sr" id="result-count" role="status" aria-live="polite"></p>
    <div id="results" class="results"></div>
    <div id="empty" class="empty" hidden><h2></h2><p></p><button type="button">清除筛选</button></div>
    <noscript>请启用 JavaScript 查看需求卡片和验收进度。</noscript>
  </main>
  <script>@@TOOLTIP@@</script>
  <script type="application/json" id="catalog-data">@@CATALOG_DATA@@</script>
  <script>
  (() => {
    'use strict'
    let data = JSON.parse(document.getElementById('catalog-data').textContent)
    function updateDay(task) {
      const date = task.updatedAt
      return typeof date === 'string' && /^\d{4}-\d{2}-\d{2}/u.test(date) ? date.slice(0,10) : ''
    }
    // Compare the displayed day. Ties retain the inventory's stable task-ID order.
    const sorted = rows => rows.slice().sort((a,b) => updateDay(b).localeCompare(updateDay(a)))
    let tasks = sorted(data.tasks)
    const oldReader = history.state?.flowReader
    const withDraft = oldReader?.url === location.href && tasks.some(t => t.id === oldReader.work && t.href === data.defaultHref)
    if (data.defaultHref && (withDraft || /^#(?:work$|agent$|contract-|node=)/u.test(location.hash))) {
      history.replaceState(history.state, '', data.defaultHref + location.search + location.hash)
      location.reload()
      return
    }
    const $ = id => document.getElementById(id)
    const search = $('catalog-query')
    const scopeButtons = [...document.querySelectorAll('[data-scope]')]
    const titles = { active: '进行中', archive: '已归档' }
    const scrollKey = () => 'requirement-flow:catalog-reading:' + data.project
    let scope = 'all'

    function el(tag, className, content) {
      const node = document.createElement(tag)
      if (className) node.className = className
      if (content !== undefined) node.textContent = content
      return node
    }
    function glyph(name) {
      const node = document.createElementNS('http://www.w3.org/2000/svg', 'svg')
      node.setAttribute('class', 'glyph')
      node.setAttribute('aria-hidden', 'true')
      const use = document.createElementNS(node.namespaceURI, 'use')
      use.setAttribute('href', '#' + name)
      node.append(use)
      return node
    }
    function meter(passed, total, label) {
      const wrap = el('div', 'meter')
      const bar = el('progress')
      bar.setAttribute('aria-label', label)
      wrap.dataset.known = String(total > 0)
      if (total > 0) {
        bar.max = total
        bar.value = passed
      }
      bar.setAttribute('aria-valuetext', label)
      wrap.append(bar)
      return wrap
    }
    function heading() {
      $('project-name').textContent = data.project
      document.title = data.project + ' · 需求中心'
      const active = tasks.filter(t => t.bucket === 'active')
      $('inventory').replaceChildren()
      for (const [n, label] of [[active.length, '进行中'], [tasks.length - active.length, '已归档']]) {
        const entry = el('span')
        entry.append(el('b', '', n), el('span', 'metric-label', ' 项' + label))
        $('inventory').append(entry)
      }
      const measured = active.filter(t => t.basis === 'scenarios' && window.FlowTooltip.taskInfo(t).measured)
      const block = $('overview')
      block.replaceChildren()
      block.hidden = !measured.length
      if (measured.length) {
        const total = measured.reduce((sum, t) => sum + t.total, 0)
        const passed = measured.reduce((sum, t) => sum + t.passed, 0)
        const count = el('span', 'overview-count')
        count.append(el('b', '', passed), ' / ' + total)
        const progress = meter(passed, total, `进行中需求已验证 ${passed} / ${total} 个场景`)
        if (total > 1 && total <= 12) {
          progress.dataset.segmented = ''
          progress.style.setProperty('--meter-step', 100 / total + '%')
        }
        block.append(count, el('span', 'overview-label', '场景通过'), progress)
      }
    }
    function card(task, index, terms) {
      const article = el('article', 'card')
      article.dataset.taskId = task.id
      article.dataset.bucket = task.bucket
      const info = window.FlowTooltip.taskInfo(task)
      const top = el('div', 'card-top')
      const status = el('span', 'state', info.state)
      status.dataset.tone = info.tone
      const meta = el('div', 'card-meta')
      const kind = el('span', 'card-type')
      const isResearch = task.outcome === 'research'
      kind.dataset.kind = isResearch ? 'research' : 'delivery'
      kind.append(glyph(isResearch ? 'research' : 'feature'), isResearch ? '调研' : '交付')
      meta.append(kind)
      const day = updateDay(task)
      if (day) {
        const date = el('time', 'card-time', day)
        date.dateTime = day
        date.title = '最近更新'
        meta.append(date)
      }
      const title = el('h3')
      title.id = 'requirement-' + index
      article.setAttribute('aria-labelledby', title.id)
      let target = article
      if (task.href && !task.error) {
        target = el('a')
        target.href = task.href
        target.append(el('span', 'card-title', info.title))
        title.append(target)
        const open = el('span', 'card-open')
        open.append(glyph('arrow'))
        meta.append(open)
      } else {
        title.append(el('span', 'card-title', info.title))
        target.tabIndex = 0
      }
      top.append(status, meta)
      article.append(top, title)
      if (!task.error && info.summary && info.summary !== info.title)
        article.append(el('p', 'card-summary', info.summary))
      const tags = tagsFor(task)
      if (tags.length) {
        const list = el('ul', 'card-tags')
        list.setAttribute('aria-label', '功能标签')
        for (const tag of tags) {
          const item = el('li', 'card-tag', tag)
          if (terms.some(term => normalize(tag).includes(term)))
            item.dataset.matched = ''
          list.append(item)
        }
        article.append(list)
      }
      const progress = el('div', 'card-progress')
      progress.append(meter(info.measured ? task.passed : 0, info.measured ? task.total : 0, info.measure))
      if (info.measured) progress.append(el('span', 'fraction', task.passed + ' / ' + task.total))
      article.append(progress)
      window.FlowTooltip.bind(target, () => info, article)
      if (task.error) {
        // A broken record has no destination. Touch readers can still inspect the cause.
        article.addEventListener('click', () => {
          let explanation = article.querySelector('.card-error')
          if (!explanation) {
            explanation = el('p', 'card-error', task.error)
            article.append(explanation)
          } else explanation.hidden = !explanation.hidden
        })
      }
      return article
    }
    const normalize = value => String(value || '').normalize('NFKC').toLocaleLowerCase()
    function readUrl() {
      const params = new URL(location.href).searchParams
      scope = Object.hasOwn(titles, params.get('scope')) ? params.get('scope') : 'all'
      search.value = params.get('q') || ''
    }
    function writeUrl() {
      const url = new URL(location.href)
      if (scope !== 'all' || search.value) url.searchParams.set('scope', scope)
      else url.searchParams.delete('scope')
      if (search.value) url.searchParams.set('q', search.value)
      else url.searchParams.delete('q')
      history.replaceState(history.state, '', url)
    }
    const tagsFor = task => Array.isArray(task.tags) ? task.tags.filter(tag => typeof tag === 'string' && tag.trim()) : []
    function searchIndex() {
      return new Map(tasks.map(t => [t,normalize([t.id,t.title,t.summary,...tagsFor(t)].join(' '))]))
    }
    let searchTexts = searchIndex()
    function render() {
      window.FlowTooltip.hide()
      const terms = normalize(search.value).trim().split(/\s+/u).filter(Boolean)
      const matching = tasks.filter(t => (scope === 'all' || scope === t.bucket) && terms.every(term => searchTexts.get(t).includes(term)))
      const sections = []
      let index = 0
      for (const [bucket, label] of Object.entries(titles)) {
        const rows = matching.filter(t => t.bucket === bucket)
        if (!rows.length) continue
        const section = el('section','section')
        section.dataset.bucket = bucket
        section.setAttribute('aria-labelledby','group-' + bucket)
        const top = el('div','section-head')
        const title = el('h2','',label)
        title.id = 'group-' + bucket
        title.prepend(glyph(bucket))
        const heading = el('div', 'section-label')
        heading.append(title, el('span', 'section-total', rows.length))
        top.append(heading)
        const grid = el('div','cards')
        for (const task of rows) grid.append(card(task,++index,terms))
        section.append(top,grid)
        sections.push(section)
      }
      $('results').replaceChildren(...sections)
      $('result-count').textContent = `显示 ${matching.length} 项需求`
      $('clear-query').hidden = !search.value
      for (const b of scopeButtons) b.setAttribute('aria-pressed',String(b.dataset.scope === scope))
      const empty = $('empty')
      empty.hidden = matching.length > 0
      if (!matching.length) {
        empty.querySelector('h2').textContent = !tasks.length ? '暂无需求' : terms.length ? '没有匹配的需求' : '暂无' + titles[scope] + '需求'
        empty.querySelector('p').textContent = !tasks.length ? '项目新增需求后会显示在这里。' : terms.length ? '换一个关键词，或清除筛选查看全部需求。' : '切换到全部可查看其他需求。'
        empty.querySelector('button').hidden = !tasks.length
      }
    }
    function refresh() { writeUrl(); render() }
    scopeButtons.forEach(b => b.addEventListener('click', () => { scope = b.dataset.scope; refresh() }))
    search.addEventListener('input', e => { if (!e.isComposing) refresh() })
    search.addEventListener('compositionend',refresh)
    $('clear-query').addEventListener('click', () => { search.value = ''; refresh(); search.focus() })
    $('empty').querySelector('button').addEventListener('click', () => { scope = 'all'; search.value = ''; refresh(); search.focus() })
    window.addEventListener('popstate', () => { readUrl(); render() })
    let touchLink = null
    $('results').addEventListener('touchend', (event) => {
      touchLink = { link: event.target.closest('a'), time: performance.now() }
    }, { passive: true })
    $('results').addEventListener('click', e => {
      const link = e.target.closest('a')
      if (!link || e.defaultPrevented || e.button !== 0 || e.ctrlKey || e.metaKey || e.shiftKey || e.altKey) return
      const task = link.closest('article').dataset.taskId
      const url = location.pathname + location.search
      const touch = e.pointerType === 'touch' || (e.detail > 0 && touchLink?.link === link && performance.now() - touchLink.time < 800)
      touchLink = null
      try {
        sessionStorage.setItem('requirement-flow:catalog-return',JSON.stringify({url,task}))
        sessionStorage.setItem(scrollKey(),JSON.stringify({url,task,scroll:scrollY}))
      } catch { /* Navigation still works when storage is unavailable. */ }
      if (touch) {
        e.preventDefault()
        const destination = new URL(link.href)
        destination.hash = 'node=%40request'
        location.assign(destination.href)
      }
    })
    function restoreReading() {
      try {
        const snapshot = JSON.parse(sessionStorage.getItem(scrollKey()))
        if (!snapshot) return
        sessionStorage.removeItem(scrollKey())
        if (snapshot.url !== location.pathname + location.search) return
        const row = [...$('results').querySelectorAll('article')].find(item => item.dataset.taskId === snapshot.task)
        row?.querySelector('a')?.focus({preventScroll:true})
        if (row && Number.isFinite(snapshot.scroll)) scrollTo(0,snapshot.scroll)
      } catch { /* The page does not require storage. */ }
    }
    // A refresh can insert new cards above the reader or move the focused card to the archive.
    function keepReading(update) {
      const results = $('results')
      const focused = document.activeElement
      const focusId = focused?.closest('article')?.dataset.taskId
      const top = results.getBoundingClientRect().top
      const anchor = top < 0 && [...results.querySelectorAll('article')].find(row => row.getBoundingClientRect().bottom > 0)
      const oldOffset = anchor && anchor.getBoundingClientRect().top
      update()
      const rows = [...results.querySelectorAll('article')]
      if (focusId || (focused === $('retry') && $('refresh-notice').hidden)) {
        const link = rows.find(row => row.dataset.taskId === focusId)?.querySelector('a')
        const next = link || scopeButtons.find(b => b.dataset.scope === scope)
        next.focus({preventScroll:true})
      }
      if (anchor) {
        const newAnchor = rows.find(row => row.dataset.taskId === anchor.dataset.taskId)
        if (newAnchor) scrollBy(0,newAnchor.getBoundingClientRect().top - oldOffset)
      }
    }
    let fingerprint = JSON.stringify(data)
    let timer = 0
    let pending
    function stopUpdates() {
      clearInterval(timer)
      timer = 0
      pending?.abort()
      pending = undefined
    }
    async function updateCatalog() {
      if (document.hidden || pending) return
      const request = new AbortController()
      pending = request
      const timeout = setTimeout(() => request.abort(),15000)
      try {
        const response = await fetch('/catalog.json',{cache:'no-store',signal:request.signal})
        if (!response.ok) throw new Error('catalog unavailable')
        const next = await response.json()
        if (typeof next?.project !== 'string' || !Array.isArray(next.tasks)
          || !next.tasks.every(t => typeof t?.id === 'string' && typeof t.title === 'string' && Object.hasOwn(titles,t.bucket)))
          throw new Error('invalid catalog')
        if (pending !== request || document.hidden) return
        const nextFingerprint = JSON.stringify(next)
        if (fingerprint === nextFingerprint && $('refresh-notice').hidden) return
        keepReading(() => {
          $('refresh-notice').hidden = true
          if (fingerprint === nextFingerprint) return
          data = next
          tasks = sorted(data.tasks)
          searchTexts = searchIndex()
          heading()
          render()
          fingerprint = nextFingerprint
        })
      } catch {
        if (pending === request && !document.hidden && $('refresh-notice').hidden)
          keepReading(() => { $('refresh-notice').hidden = false })
      } finally {
        clearTimeout(timeout)
        if (pending === request) pending = undefined
      }
    }
    function startUpdates(checkNow) {
      if (document.hidden) return
      if (!timer) timer = setInterval(updateCatalog,30000)
      if (checkNow) updateCatalog()
    }
    heading()
    readUrl()
    render()
    $('retry').addEventListener('click',updateCatalog)
    window.addEventListener('pageshow',e => { restoreReading(); startUpdates(e.persisted) })
    window.addEventListener('pagehide',stopUpdates)
    document.addEventListener('visibilitychange',() => {
      if (document.hidden) stopUpdates()
      else startUpdates(true)
    })
  })()
  </script>
  <span id="catalog-ready" hidden></span>
</body>
</html>
