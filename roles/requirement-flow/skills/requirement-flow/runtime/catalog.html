<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <title>需求中心 · 需求全景图</title>
  <style>
    @@THEME@@
    :root { font:15px/1.5 var(--ui); color:var(--ink); background:var(--paper) }
    * { box-sizing:border-box }
    body,h1,h2,h3,p { margin:0 }
    body { min-height:100vh; background:
      radial-gradient(ellipse at 84% 0%,#38254b88,transparent 48rem),
      radial-gradient(ellipse at 0% 60%,#21193680,transparent 42rem),
      var(--paper) }
    [hidden] { display:none!important }
    button,input { font:inherit; color:inherit }
    button,a { -webkit-tap-highlight-color:transparent }
    button { cursor:pointer }
    :focus-visible { outline:2px solid var(--focus-ring); outline-offset:4px }
    .wrap { width:min(1280px,calc(100% - clamp(32px,9vw,160px))); margin-inline:auto }
    .masthead { background:#14101f99; border-bottom:1px solid #ddc8ff20; backdrop-filter:blur(18px) }
    .masthead .wrap { display:flex; align-items:center; justify-content:space-between; gap:20px; min-height:64px }
    .brand,.workspace { display:inline-flex; align-items:center; gap:10px; min-width:0 }
    .brand { flex:none; color:var(--ink); font-weight:700; letter-spacing:.03em; text-decoration:none }
    .brand-mark { display:grid; place-items:center; width:36px; height:36px; border:1px solid #e9ceff4d; border-radius:11px;
      color:var(--accent); background:linear-gradient(145deg,#5d3e72,#2a1d41 72%); box-shadow:0 4px 15px #0b071c88,inset 0 1px #fff2 }
    .brand-mark svg { width:24px; height:24px }
    .workspace { max-width:min(60%,360px); padding:6px 11px; color:var(--text); background:#251e36;
      border:1px solid var(--line); border-radius:9px; font-size:.81rem }
    .workspace .glyph { width:15px; height:15px; color:var(--accent) }
    .workspace span { min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap }
    .glyph { display:block; flex:none; width:18px; height:18px; fill:none; stroke:currentColor; stroke-width:1.55; stroke-linecap:round; stroke-linejoin:round }
    .icon-defs { display:none }
    main { padding-block:clamp(20px,2.5vw,36px) 64px }
    .desk { position:relative; display:grid; align-items:center; min-height:340px; isolation:isolate; overflow:hidden; padding:clamp(26px,4.2vw,60px);
      border:1px solid #a584c756; border-radius:28px; background:#191327; box-shadow:0 24px 64px #08061652,inset 0 1px #ecd2ff25 }
    .desk::before,.desk::after { content:""; position:absolute; inset:0; pointer-events:none }
    .desk::before { z-index:-1; background:
      linear-gradient(90deg,#1c142c 3%,#1e142eea 27%,#1e142e60 55%,transparent 75%),
      linear-gradient(0deg,#1c132c80,transparent 33%) }
    .desk::after { border-radius:inherit; box-shadow:inset 0 1px #f2ceff45;
      background:linear-gradient(122deg,#ecd2ff0b,transparent 42%) }
    .desk-art { position:absolute; z-index:-2; inset:0 0 0 auto; width:78%; overflow:hidden }
    .desk-art img { position:absolute; top:-6%; right:0; display:block; width:auto; height:112%; mask-image:linear-gradient(90deg,transparent,#000 20%) }
    .desk-content { position:relative; display:grid; justify-items:start; align-content:center; width:fit-content; max-width:100% }
    .desk h1 { font:760 clamp(3rem,5.65vw,5.6rem)/1.09 var(--display); letter-spacing:-.067em; text-shadow:0 9px 35px #0f081c90 }
    .inventory { display:flex; flex-wrap:wrap; align-items:center; gap:8px; margin-top:18px; color:var(--text); font-size:.84rem }
    .inventory span { padding:5px 10px; border:1px solid #b998d144; border-radius:999px; background:#39294d8a }
    .inventory b { font:650 .91rem var(--mono); color:var(--ink) }
    .overview { display:grid; grid-template-columns:minmax(0,1fr) auto; align-items:baseline; gap:8px 16px; width:min(100%,304px);
      margin-top:24px; padding:12px 14px 14px; border:1px solid #b597d24d; border-radius:13px;
      background:#281e3dbf; backdrop-filter:blur(16px) saturate(1.18); box-shadow:0 6px 20px #0a061f40,inset 0 1px #f9ddff0d }
    .overview-label { color:var(--text); font-size:.79rem; font-weight:550 }
    .overview-count { font:.89rem var(--mono); color:var(--muted); white-space:nowrap }
    .overview-count b { color:var(--teal); font-size:1.28rem; font-weight:650 }
    .overview .meter { grid-column:1/-1; height:6px; --track:#574266; --gap:#2d2141 }
    .toolbar { display:flex; justify-content:space-between; align-items:center; gap:14px; margin:26px 0 28px }
    .filters { display:inline-flex; align-items:center; gap:3px; padding:4px; border:1px solid var(--line); border-radius:13px; background:#1d172b99 }
    .filters button { display:inline-flex; align-items:center; justify-content:center; min-height:35px; padding:5px 16px; border:1px solid transparent; border-radius:9px;
      background:transparent; color:var(--muted); white-space:nowrap; font-size:.87rem; font-weight:650 }
    .filters button:hover { background:var(--surface-hover); color:var(--ink) }
    .filters button[aria-pressed=true] { background:linear-gradient(130deg,#ebd5ff,#cdb1fa); color:var(--on-accent); box-shadow:0 2px 10px #b68bff2e,inset 0 1px #fff7 }
    .search { display:flex; align-items:center; gap:10px; min-width:0; width:min(300px,100%); height:45px; padding:0 13px;
      border:1px solid var(--line); border-radius:13px; background:#20192e; color:var(--muted) }
    .search:focus-within { border-color:var(--accent); box-shadow:0 0 0 3px #d5bdff28 }
    .search input { width:100%; min-width:0; padding:0; background:transparent; border:0; appearance:none; outline:none; color:var(--ink); font-size:.89rem }
    .search input::placeholder { color:var(--muted) }
    .search input::-webkit-search-cancel-button { display:none }
    .search button { display:grid; place-items:center; padding:5px; border:0; border-radius:6px; background:transparent; color:var(--text) }
    .search button:hover { background:var(--surface-hover) }
    .search button .glyph { width:15px; height:15px }
    .refresh-notice { display:flex; align-items:center; flex-wrap:wrap; gap:8px; margin:-8px 0 20px; padding:10px 14px; border-radius:10px;
      border:1px solid #876347; color:var(--amber); background:#322239; font-size:.84rem }
    .refresh-notice button { padding:3px 6px; color:var(--accent); text-decoration:underline; text-underline-offset:3px; font-weight:600; border:0; border-radius:3px; background:transparent }
    .results { scroll-margin-top:16px }
    .section+.section { margin-top:32px }
    .section-head { display:flex; align-items:center; gap:10px; margin-bottom:13px }
    .section-head h2 { font-size:1.33rem; font-weight:700; letter-spacing:-.025em }
    .section-total { padding:2px 7px; border:1px solid var(--line); border-radius:6px; color:var(--text); background:var(--surface); font:.75rem var(--mono) }
    .section-head::after { content:""; flex:1; height:1px; margin-left:5px; background:linear-gradient(90deg,var(--line),transparent) }
    .cards { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:14px }
    .card { --card-accent:var(--accent); position:relative; display:flex; flex-direction:column; gap:8px; min-width:0; min-height:158px; padding:15px 16px;
      isolation:isolate; border:1px solid var(--line); border-radius:17px; color:var(--text);
      background:radial-gradient(ellipse at 7% 0%,#5d437738,transparent 65%),linear-gradient(150deg,#262038,#1b172a 75%); box-shadow:0 8px 22px #08061340,inset 0 1px #f5d8ff0c }
    .card[data-bucket=archive] { --card-accent:var(--muted); background:linear-gradient(145deg,#231d33,#191625) }
    .card:is(:hover,:active,:focus-within) { border-color:var(--accent) }
    .card:has(a:focus-visible),.card:focus-visible { outline:2px solid var(--focus-ring); outline-offset:2px }
    .card-meta { display:flex; align-items:center; justify-content:space-between; gap:8px; color:var(--muted); font:.75rem var(--mono) }
    .card-type { display:inline-flex; align-items:center; gap:7px; color:var(--text); font:550 .76rem var(--ui) }
    .card-type .glyph { box-sizing:content-box; width:16px; height:16px; padding:5px; border:1px solid #a387c048; border-radius:8px; color:var(--card-accent); background:#59467238 }
    .card h3 { min-width:0; color:var(--ink); font-size:1.17rem; line-height:1.34; font-weight:690; letter-spacing:-.026em; overflow-wrap:anywhere }
    .card h3 a { display:flex; align-items:center; gap:8px; justify-content:space-between; color:inherit; text-decoration:none; outline:none }
    .card h3 .card-title { display:block; white-space:nowrap; text-overflow:ellipsis; overflow:hidden }
    .card h3 a::after { content:""; position:absolute; inset:0; z-index:1; border-radius:inherit }
    .card h3 .glyph { width:17px; height:17px; color:var(--card-accent) }
    .card-summary { margin-top:-3px; min-width:0; color:var(--muted); font-size:.82rem; white-space:nowrap; overflow:hidden; text-overflow:ellipsis }
    .card-line { display:flex; align-items:center; gap:8px; min-width:0; margin-top:auto }
    .state { display:flex; align-items:center; gap:6px; min-width:0; color:var(--teal); font-size:.76rem; line-height:1.35 }
    .state::before { content:""; width:6px; height:6px; flex:none; border-radius:50%; background:currentColor; box-shadow:0 0 9px currentColor }
    .state[data-tone=amber] { color:var(--amber) }
    .state[data-tone=neutral],.fraction { color:var(--muted) }
    .state[data-tone=neutral]::before { box-shadow:none }
    .fraction { margin-left:auto; font:.76rem/1.3 var(--mono) }
    .card-error { color:var(--amber); font-size:.84rem }
    .meter { position:relative; height:5px; overflow:hidden; border-radius:999px; --track:#443953; --fill:var(--teal); --gap:#20192d }
    .meter progress { display:block; width:100%; height:100%; margin:0; border:none; appearance:none; background:var(--track); color:var(--fill) }
    .meter progress::-webkit-progress-bar { background:var(--track) }
    .meter progress::-webkit-progress-value { background:linear-gradient(90deg,#64bcb7,var(--fill)) }
    .meter progress::-moz-progress-bar { background:linear-gradient(90deg,#64bcb7,var(--fill)) }
    .meter::after { content:""; position:absolute; inset:0; pointer-events:none; background:repeating-linear-gradient(90deg,transparent 0 calc(var(--step) - 2px),var(--gap) calc(var(--step) - 2px) var(--step)) }
    .meter[data-known=false] { background:repeating-linear-gradient(120deg,var(--paper) 0 5px,var(--line) 5px 7px) }
    .meter[data-known=false] progress { opacity:0 }
    .meter[data-known=false]::after { display:none }
    .empty { display:grid; justify-items:center; gap:7px; padding:50px 18px; border:1px dashed var(--line-strong); border-radius:17px; background:#20192ca6; text-align:center }
    .empty h2 { font-size:1.18rem }
    .empty p { color:var(--muted); font-size:.9rem }
    .empty button { margin-top:9px; padding:7px 14px; border:1px solid var(--line-strong); border-radius:8px;
      background:var(--accent-bg); color:var(--accent); font-size:.86rem; font-weight:650 }
    .empty button:hover { background:var(--surface-hover) }
    .sr { position:absolute; width:1px; height:1px; padding:0; overflow:hidden; clip-path:inset(50%); white-space:nowrap }
    @media (max-width:880px) {
      .desk { min-height:306px }
      .cards { grid-template-columns:repeat(2,minmax(0,1fr)) }
    }
    @media (max-width:560px) {
      .masthead .wrap { min-height:56px }
      .desk { min-height:270px; padding:25px 19px; border-radius:20px }
      .desk h1 { font-size:clamp(2.6rem,10.5vw,3.55rem) }
      .desk-art { width:100%; opacity:.70 }
      .desk::before { background:linear-gradient(90deg,#1c142bf7,#1d142cba 50%,#1f14313d),linear-gradient(0deg,#1f142e9e,transparent 55%) }
      .overview { margin-top:20px; width:min(100%,262px) }
      .inventory { margin-top:14px }
      .toolbar { align-items:stretch; flex-direction:column; gap:9px; margin:20px 0 22px }
      .filters button { flex:1 }
      .search { width:100%; height:43px }
      .cards { grid-template-columns:minmax(0,1fr); gap:10px }
      .card { min-height:144px; padding:13px 15px }
      .section+.section { margin-top:27px }
    }
    @media (prefers-reduced-motion:no-preference) {
      .desk-content,.toolbar,.results { animation:enter .58s cubic-bezier(.22,.76,.18,1) backwards }
      .toolbar { animation-delay:65ms }
      .results { animation-delay:125ms }
      .card,.card h3 .glyph,.brand-mark,.filters button,.search { transition:background-color .2s ease,border-color .2s ease,box-shadow .2s ease,transform .24s ease,color .2s ease }
      @media (hover:hover) {
        .card:hover { transform:translateY(-3px); box-shadow:0 14px 28px #08061366,inset 0 1px #f5d8ff20 }
        .card:hover h3 .glyph { transform:translateX(3px); color:var(--rose) }
        .brand:hover .brand-mark { transform:rotate(-7deg) }
      }
      @keyframes enter { from { opacity:0; transform:translateY(10px) } to { opacity:1; transform:translateY(0) } }
      @supports (animation-timeline:view()) {
        .desk { view-timeline-name:--desk; view-timeline-axis:block }
        .desk-art img { animation:art-drift linear both; animation-timeline:--desk; animation-range:exit 0% exit 100% }
        @keyframes art-drift { from { transform:scale(1.05) } to { transform:translateY(13%) scale(1.13) } }
      }
    }
    @media (forced-colors:active) {
      .desk-art { display:none }
      .card:is(:hover,:active,:focus-within),.filters button[aria-pressed=true] { border-color:Highlight }
      .meter { border:1px solid CanvasText }
      .meter[data-known=false] { border-style:dashed }
      .meter[data-known=true] progress { appearance:auto }
      .meter::after { display:none }
    }
  </style>
</head>
<body>
  <svg class="icon-defs" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><defs>
    <symbol id="folder" viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h5l2 2h7a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></symbol>
    <symbol id="feature" viewBox="0 0 24 24"><path d="m12 3 9 5-9 5-9-5 9-5zm-9 9 9 5 9-5M3 16l9 5 9-5"/></symbol>
    <symbol id="research" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m15.5 15.5 5 5"/></symbol>
    <symbol id="archive" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="5" rx="1.5"/><path d="M5 9v10h14V9m-9 4h4"/></symbol>
    <symbol id="arrow" viewBox="0 0 24 24"><path d="M5 12h13m-5-5 5 5-5 5"/></symbol>
    <symbol id="clear" viewBox="0 0 24 24"><path d="m7 7 10 10m0-10L7 17"/></symbol>
  </defs></svg>
  <header class="masthead"><div class="wrap">
    <a class="brand" id="catalog-home" href="?" aria-label="首页"><span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 32 32" fill="none"><path d="M6 16h7c6 0 3-8 10-8h3m-14 8c6 0 4 8 10 8h4" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/><circle cx="5" cy="16" r="3" fill="#fff"/><circle cx="26" cy="8" r="3" fill="#f0acd3"/><circle cx="26" cy="24" r="3" fill="currentColor"/></svg></span>首页</a>
    <span class="workspace"><svg class="glyph" aria-hidden="true"><use href="#folder"/></svg><span id="project-name"></span></span>
  </div></header>
  <main class="wrap">
    <section class="desk" aria-labelledby="page-title">
      <div class="desk-art" aria-hidden="true"><img src="data:image/webp;base64,@@CATALOG_HERO@@" alt="" width="1440" height="810"></div>
      <div class="desk-content">
        <h1 id="page-title">需求中心</h1>
        <p class="inventory" id="inventory"></p>
        <div id="overview" class="overview" hidden></div>
      </div>
    </section>
    <div class="toolbar">
      <div class="filters" role="group" aria-label="需求范围">
        <button type="button" data-scope="all" aria-pressed="true">全部</button>
        <button type="button" data-scope="active" aria-pressed="false">进行中</button>
        <button type="button" data-scope="archive" aria-pressed="false">已归档</button>
      </div>
      <div class="search"><svg class="glyph" aria-hidden="true"><use href="#research"/></svg>
        <input id="catalog-query" type="search" aria-label="搜索需求" placeholder="搜索需求" autocomplete="off">
        <button id="clear-query" type="button" aria-label="清除搜索" hidden><svg class="glyph" aria-hidden="true"><use href="#clear"/></svg></button>
      </div>
    </div>
    <div class="refresh-notice" id="refresh-notice" hidden><span role="status">暂时无法更新，正在显示上次读取的需求。</span><button id="retry" type="button">重试</button></div>
    <p class="sr" id="result-count" role="status" aria-live="polite"></p>
    <div id="results" class="results"></div>
    <div id="empty" class="empty" hidden><h2></h2><p></p><button type="button">清除筛选</button></div>
    <noscript>请启用 JavaScript 查看需求卡片和验收进度。</noscript>
  </main>
  <script>@@TOOLTIP@@</script>
  <script type="application/json" id="catalog-data">@@CATALOG_DATA@@</script>
  <script>
  (() => {
    'use strict'
    let data = JSON.parse(document.getElementById('catalog-data').textContent)
    function updateDay(task) {
      const date = task.updatedAt
      return typeof date === 'string' && /^\d{4}-\d{2}-\d{2}/u.test(date) ? date.slice(0,10) : ''
    }
    // Compare the displayed day. Ties retain the inventory's stable task-ID order.
    const sorted = rows => rows.slice().sort((a,b) => updateDay(b).localeCompare(updateDay(a)))
    let tasks = sorted(data.tasks)
    const oldReader = history.state?.flowReader
    const withDraft = oldReader?.url === location.href && tasks.some(t => t.id === oldReader.work && t.href === data.defaultHref)
    if (data.defaultHref && (withDraft || /^#(?:work$|agent$|contract-|node=)/u.test(location.hash))) {
      history.replaceState(history.state, '', data.defaultHref + location.search + location.hash)
      location.reload()
      return
    }
    const $ = id => document.getElementById(id)
    const search = $('catalog-query')
    const scopeButtons = [...document.querySelectorAll('[data-scope]')]
    const titles = { active: '进行中', archive: '已归档' }
    const scrollKey = () => 'requirement-flow:catalog-reading:' + data.project
    let scope = 'all'

    function el(tag, className, content) {
      const node = document.createElement(tag)
      if (className) node.className = className
      if (content !== undefined) node.textContent = content
      return node
    }
    function glyph(name) {
      const node = document.createElementNS('http://www.w3.org/2000/svg', 'svg')
      node.setAttribute('class', 'glyph')
      node.setAttribute('aria-hidden', 'true')
      const use = document.createElementNS(node.namespaceURI, 'use')
      use.setAttribute('href', '#' + name)
      node.append(use)
      return node
    }
    function meter(passed, total, label) {
      const wrap = el('div', 'meter')
      const bar = el('progress')
      bar.setAttribute('aria-label', label)
      wrap.dataset.known = String(total > 0)
      if (total > 0) {
        bar.max = total
        bar.value = passed
        wrap.style.setProperty('--step', 100 / Math.min(total, 25) + '%')
      }
      bar.setAttribute('aria-valuetext', label)
      wrap.append(bar)
      return wrap
    }
    function heading() {
      $('project-name').textContent = data.project
      document.title = data.project + ' · 需求中心'
      const active = tasks.filter(t => t.bucket === 'active')
      $('inventory').replaceChildren()
      for (const [n, label] of [[active.length, '进行中'], [tasks.length - active.length, '已归档']]) {
        const entry = el('span')
        entry.append(el('b', '', n), ' 项' + label)
        $('inventory').append(entry)
      }
      const measured = active.filter(t => t.basis === 'scenarios' && window.FlowTooltip.taskInfo(t).measured)
      const block = $('overview')
      block.replaceChildren()
      block.hidden = !measured.length
      if (measured.length) {
        const total = measured.reduce((sum, t) => sum + t.total, 0)
        const passed = measured.reduce((sum, t) => sum + t.passed, 0)
        const count = el('span', 'overview-count')
        count.append(el('b', '', passed), ' / ' + total)
        block.append(el('span', 'overview-label', '进行中 · 场景通过'), count, meter(passed, total, `进行中需求已验证 ${passed} / ${total} 个场景`))
      }
    }
    function card(task, index) {
      const article = el('article', 'card')
      article.dataset.taskId = task.id
      article.dataset.bucket = task.bucket
      const info = window.FlowTooltip.taskInfo(task)
      const meta = el('div', 'card-meta')
      const kind = el('span', 'card-type')
      const isResearch = task.outcome === 'research'
      kind.append(glyph(task.bucket === 'archive' ? 'archive' : isResearch ? 'research' : 'feature'), isResearch ? '调研' : '交付')
      meta.append(kind)
      const day = updateDay(task)
      if (day) {
        const date = el('time', '', day)
        date.dateTime = day
        date.title = '最近更新'
        meta.append(date)
      }
      const title = el('h3')
      title.id = 'requirement-' + index
      article.setAttribute('aria-labelledby', title.id)
      let target = article
      if (task.href && !task.error) {
        target = el('a')
        target.href = task.href
        target.append(el('span', 'card-title', info.title), glyph('arrow'))
        title.append(target)
      } else {
        title.append(el('span', 'card-title', info.title))
        target.tabIndex = 0
      }
      const status = el('span', 'state', info.state)
      status.dataset.tone = info.tone
      const line = el('div', 'card-line')
      line.append(status)
      if (info.measured)
        line.append(el('span', 'fraction', task.passed + '/' + task.total))
      article.append(meta, title)
      if (!task.error && info.summary && info.summary !== info.title)
        article.append(el('p', 'card-summary', info.summary))
      article.append(line, meter(info.measured ? task.passed : 0, info.measured ? task.total : 0, info.measure))
      window.FlowTooltip.bind(target, () => info, article)
      if (task.error) {
        // A broken record has no destination. Touch readers can still inspect the cause.
        article.addEventListener('click', () => {
          let explanation = article.querySelector('.card-error')
          if (!explanation) {
            explanation = el('p', 'card-error', task.error)
            article.append(explanation)
          } else explanation.hidden = !explanation.hidden
        })
      }
      return article
    }
    const normalize = value => String(value || '').normalize('NFKC').toLocaleLowerCase()
    function readUrl() {
      const params = new URL(location.href).searchParams
      scope = Object.hasOwn(titles, params.get('scope')) ? params.get('scope') : 'all'
      search.value = params.get('q') || ''
    }
    function writeUrl() {
      const url = new URL(location.href)
      if (scope !== 'all' || search.value) url.searchParams.set('scope', scope)
      else url.searchParams.delete('scope')
      if (search.value) url.searchParams.set('q', search.value)
      else url.searchParams.delete('q')
      history.replaceState(history.state, '', url)
    }
    function searchIndex() {
      return new Map(tasks.map(t => [t,normalize([t.id,t.title,t.summary].join(' '))]))
    }
    let searchTexts = searchIndex()
    function render() {
      window.FlowTooltip.hide()
      const terms = normalize(search.value).trim().split(/\s+/u).filter(Boolean)
      const matching = tasks.filter(t => (scope === 'all' || scope === t.bucket) && terms.every(term => searchTexts.get(t).includes(term)))
      const sections = []
      let index = 0
      for (const [bucket, label] of Object.entries(titles)) {
        const rows = matching.filter(t => t.bucket === bucket)
        if (!rows.length) continue
        const section = el('section','section')
        section.dataset.bucket = bucket
        section.setAttribute('aria-labelledby','group-' + bucket)
        const top = el('div','section-head')
        const title = el('h2','',label)
        title.id = 'group-' + bucket
        top.append(title,el('span','section-total',rows.length))
        const grid = el('div','cards')
        for (const task of rows) grid.append(card(task,++index))
        section.append(top,grid)
        sections.push(section)
      }
      $('results').replaceChildren(...sections)
      $('result-count').textContent = `显示 ${matching.length} 项需求`
      $('clear-query').hidden = !search.value
      for (const b of scopeButtons) b.setAttribute('aria-pressed',String(b.dataset.scope === scope))
      const empty = $('empty')
      empty.hidden = matching.length > 0
      if (!matching.length) {
        empty.querySelector('h2').textContent = !tasks.length ? '暂无需求' : terms.length ? '没有匹配的需求' : '暂无' + titles[scope] + '需求'
        empty.querySelector('p').textContent = !tasks.length ? '项目新增需求后会显示在这里。' : terms.length ? '换一个关键词，或清除筛选查看全部需求。' : '切换到全部可查看其他需求。'
        empty.querySelector('button').hidden = !tasks.length
      }
    }
    function refresh() { writeUrl(); render() }
    scopeButtons.forEach(b => b.addEventListener('click', () => { scope = b.dataset.scope; refresh() }))
    search.addEventListener('input', e => { if (!e.isComposing) refresh() })
    search.addEventListener('compositionend',refresh)
    $('clear-query').addEventListener('click', () => { search.value = ''; refresh(); search.focus() })
    $('empty').querySelector('button').addEventListener('click', () => { scope = 'all'; search.value = ''; refresh(); search.focus() })
    window.addEventListener('popstate', () => { readUrl(); render() })
    let touchLink = null
    $('results').addEventListener('touchend', (event) => {
      touchLink = { link: event.target.closest('a'), time: performance.now() }
    }, { passive: true })
    $('results').addEventListener('click', e => {
      const link = e.target.closest('a')
      if (!link || e.defaultPrevented || e.button !== 0 || e.ctrlKey || e.metaKey || e.shiftKey || e.altKey) return
      const task = link.closest('article').dataset.taskId
      const url = location.pathname + location.search
      const touch = e.pointerType === 'touch' || (e.detail > 0 && touchLink?.link === link && performance.now() - touchLink.time < 800)
      touchLink = null
      try {
        sessionStorage.setItem('requirement-flow:catalog-return',JSON.stringify({url,task}))
        sessionStorage.setItem(scrollKey(),JSON.stringify({url,task,scroll:scrollY}))
      } catch { /* Navigation still works when storage is unavailable. */ }
      if (touch) {
        e.preventDefault()
        const destination = new URL(link.href)
        destination.hash = 'node=%40request'
        location.assign(destination.href)
      }
    })
    function restoreReading() {
      try {
        const snapshot = JSON.parse(sessionStorage.getItem(scrollKey()))
        if (!snapshot) return
        sessionStorage.removeItem(scrollKey())
        if (snapshot.url !== location.pathname + location.search) return
        const row = [...$('results').querySelectorAll('article')].find(item => item.dataset.taskId === snapshot.task)
        row?.querySelector('a')?.focus({preventScroll:true})
        if (row && Number.isFinite(snapshot.scroll)) scrollTo(0,snapshot.scroll)
      } catch { /* The page does not require storage. */ }
    }
    // A refresh can insert new cards above the reader or move the focused card to the archive.
    function keepReading(update) {
      const results = $('results')
      const focused = document.activeElement
      const focusId = focused?.closest('article')?.dataset.taskId
      const top = results.getBoundingClientRect().top
      const anchor = top < 0 && [...results.querySelectorAll('article')].find(row => row.getBoundingClientRect().bottom > 0)
      const oldOffset = anchor && anchor.getBoundingClientRect().top
      update()
      const rows = [...results.querySelectorAll('article')]
      if (focusId || (focused === $('retry') && $('refresh-notice').hidden)) {
        const link = rows.find(row => row.dataset.taskId === focusId)?.querySelector('a')
        const next = link || scopeButtons.find(b => b.dataset.scope === scope)
        next.focus({preventScroll:true})
      }
      if (anchor) {
        const newAnchor = rows.find(row => row.dataset.taskId === anchor.dataset.taskId)
        if (newAnchor) scrollBy(0,newAnchor.getBoundingClientRect().top - oldOffset)
      }
    }
    let fingerprint = JSON.stringify(data)
    let timer = 0
    let pending
    function stopUpdates() {
      clearInterval(timer)
      timer = 0
      pending?.abort()
      pending = undefined
    }
    async function updateCatalog() {
      if (document.hidden || pending) return
      const request = new AbortController()
      pending = request
      const timeout = setTimeout(() => request.abort(),15000)
      try {
        const response = await fetch('/catalog.json',{cache:'no-store',signal:request.signal})
        if (!response.ok) throw new Error('catalog unavailable')
        const next = await response.json()
        if (typeof next?.project !== 'string' || !Array.isArray(next.tasks)
          || !next.tasks.every(t => typeof t?.id === 'string' && typeof t.title === 'string' && Object.hasOwn(titles,t.bucket)))
          throw new Error('invalid catalog')
        if (pending !== request || document.hidden) return
        const nextFingerprint = JSON.stringify(next)
        if (fingerprint === nextFingerprint && $('refresh-notice').hidden) return
        keepReading(() => {
          $('refresh-notice').hidden = true
          if (fingerprint === nextFingerprint) return
          data = next
          tasks = sorted(data.tasks)
          searchTexts = searchIndex()
          heading()
          render()
          fingerprint = nextFingerprint
        })
      } catch {
        if (pending === request && !document.hidden && $('refresh-notice').hidden)
          keepReading(() => { $('refresh-notice').hidden = false })
      } finally {
        clearTimeout(timeout)
        if (pending === request) pending = undefined
      }
    }
    function startUpdates(checkNow) {
      if (document.hidden) return
      if (!timer) timer = setInterval(updateCatalog,30000)
      if (checkNow) updateCatalog()
    }
    heading()
    readUrl()
    render()
    $('retry').addEventListener('click',updateCatalog)
    window.addEventListener('pageshow',e => { restoreReading(); startUpdates(e.persisted) })
    window.addEventListener('pagehide',stopUpdates)
    document.addEventListener('visibilitychange',() => {
      if (document.hidden) stopUpdates()
      else startUpdates(true)
    })
  })()
  </script>
</body>
</html>
